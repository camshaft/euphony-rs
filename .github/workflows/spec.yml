on:
  pull_request:
    paths:
      - "spec/**"
      - ".github/workflows/spec.yml"
  # A run on master saves the tools cache in master's scope, which every pull request's run can restore.
  push:
    branches:
      - master
    paths:
      - "spec/**"
      - ".github/workflows/spec.yml"

name: spec

permissions:
  contents: read

concurrency:
  group: spec-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request cancels its older run. A run on master is never cancelled: each one saves the tools
  # cache in master's scope, and a later merge would otherwise cancel it before it finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PARTIMENTO_REV: 1616d94960a1426fed9c5c4d660d0e5ec31f7c39 # partimento v0.6.0
  DUVET_VERSION: 0.4.3

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The steps below run wherever the branch holds any file under spec/; a branch from before the specification skips them.
      # The two tools are cached by their pinned versions, so a run builds them only on a cache miss.
      # actions/cache/restore v6.1.0
      - name: Restore the spec tools
        id: tools
        if: hashFiles('spec/**') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/partimento
            ~/.cargo/bin/duvet
          key: spec-tools-${{ runner.os }}-partimento-${{ env.PARTIMENTO_REV }}-duvet-${{ env.DUVET_VERSION }}

      - name: Install partimento
        if: hashFiles('spec/**') != '' && steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/camshaft/partimento --rev "$PARTIMENTO_REV" partimento

      - name: Install duvet
        if: hashFiles('spec/**') != '' && steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked duvet --version "$DUVET_VERSION"

      # Saved right after the installs, so a run whose check fails, or that a newer push cancels later, still keeps the tools.
      # actions/cache/save v6.1.0
      - name: Save the spec tools
        if: hashFiles('spec/**') != '' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/partimento
            ~/.cargo/bin/duvet
          key: spec-tools-${{ runner.os }}-partimento-${{ env.PARTIMENTO_REV }}-duvet-${{ env.DUVET_VERSION }}

      - name: partimento check
        if: hashFiles('spec/**') != ''
        working-directory: spec
        run: partimento check

      - name: duvet report
        if: hashFiles('spec/**') != ''
        working-directory: spec
        run: duvet report
