on:
  pull_request:
    paths:
      - "spec/**"
      - ".github/workflows/spec.yml"

name: spec

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The steps below run wherever the branch holds any file under spec/; a branch from before the specification skips them.
      # partimento v0.6.0
      - name: Install partimento
        if: hashFiles('spec/**') != ''
        run: cargo install --locked --git https://github.com/camshaft/partimento --rev 1616d94960a1426fed9c5c4d660d0e5ec31f7c39 partimento

      - name: Install duvet
        if: hashFiles('spec/**') != ''
        run: cargo install --locked duvet --version 0.4.3

      - name: partimento check
        if: hashFiles('spec/**') != ''
        working-directory: spec
        run: partimento check

      - name: duvet report
        if: hashFiles('spec/**') != ''
        working-directory: spec
        run: duvet report
