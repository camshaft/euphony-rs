[section]
anchor = 'structures'
title = 'Proposing structures and fitting them'
problem = """\
  A fit that could run any processor or any code would leave the project with a sound the musician \
  cannot read or trust, and a fit without a recorded start cannot be repeated."""
motivation = """\
  Structures checked against the built-in processor catalog, and fits that record how they started, \
  keep every rebuilt sound readable, adjustable and repeatable."""
prose = """
A structure is a typed graph of built-in processors: a voice, such as a subtractive, wavetable,
frequency-modulation or physical-model voice, a sampler of built-in sounds or a noise source,
followed by a chain of built-in effects, such as filters, an equalizer, a compressor, saturation,
chorus, delay and reverb. Each parameter of each processor has the domain and the units the
processor catalog states. The rebuild's planner and the assistants the musician connects propose
structures, starting from the analysis of the passage. A fit tunes the settings of one structure
until its render of the passage's notes measures closest to the original. A run fits each proposed
structure, and ends by its stopping rules or when the musician stops it. Its stopping rules read
the held-back measures where the passage holds enough notes to hold some back, and the measures on
the fitted notes where it doesn't. The musician's stopping-rule setting counts the rounds without
improvement that end a run, not the rounds in all, so a run that still improves goes on."""

[[requirement]]
id = 'EU-0023-017'
level = 'MUST'
polarity = 'required'
statement = 'Each proposed structure MUST be a typed graph of processors that the built-in processor catalog holds.'
binds_to = 'system'
rationale = 'Every setting of the result is a control of a built-in processor.'

[[requirement]]
id = 'EU-0023-018'
level = 'MUST'
polarity = 'forbidden'
statement = 'A proposed structure MUST NOT hold code.'
binds_to = 'system'
rationale = "A proposal can't run anything on the musician's computers."

[[requirement]]
id = 'EU-0023-019'
level = 'MUST'
polarity = 'required'
statement = "A rebuild MUST refuse a proposed structure that holds a processor the catalog doesn't hold."
binds_to = 'system'
rationale = "A structure the catalog doesn't hold can't reach a fit."
relations = [ { kind = 'depends_on', target = 'EU-0023-017' } ]

[[requirement]]
id = 'EU-0023-020'
level = 'MUST'
polarity = 'required'
statement = 'An assistant the musician connects MUST be able to propose structures for a rebuild.'
binds_to = 'system'
rationale = 'An assistant brings its own knowledge of how sounds are made.'

[[requirement]]
id = 'EU-0023-021'
level = 'MUST'
polarity = 'required'
statement = 'A fit MUST render the notes of the passage through its structure and measure the difference of that render from the original.'
binds_to = 'system'
rationale = 'The measured difference is the only judge of a fit.'

[[requirement]]
id = 'EU-0023-022'
level = 'MUST'
polarity = 'required'
statement = 'A fit MUST tune the settings of its structure to reduce its measured difference from the original.'
binds_to = 'system'
rationale = 'The fit moves its settings toward the original.'
relations = [ { kind = 'depends_on', target = 'EU-0023-021' } ]

[[requirement]]
id = 'EU-0023-023'
level = 'MUST'
polarity = 'required'
statement = 'Each fit MUST record its seed, its starting values, the versions of its processors and the version of its measurements.'
binds_to = 'system'
rationale = 'A fit can be repeated exactly.'

[[requirement]]
id = 'EU-0023-024'
level = 'MUST'
polarity = 'required'
statement = 'Where the passage holds enough notes to hold some back, a run MUST end when its held-back measures stop improving beyond their intervals.'
binds_to = 'system'
rationale = 'A run stops once more rounds no longer help.'
relations = [ { kind = 'depends_on', target = 'EU-0023-073' } ]

[[requirement]]
id = 'EU-0023-025'
level = 'MUST'
polarity = 'required'
statement = 'A run MUST end when the musician stops it.'
binds_to = 'system'
rationale = 'The musician stays in control of how long a rebuild runs.'

[[requirement]]
id = 'EU-0023-072'
level = 'MUST'
polarity = 'required'
statement = 'Where the passage holds too few notes to hold some back, a run MUST end when its measures on the fitted notes stop improving beyond their intervals.'
binds_to = 'system'
rationale = 'A run on a short passage ends by its measures, and not only when the musician stops it.'
relations = [ { kind = 'depends_on', target = 'EU-0023-073' } ]

[[requirement]]
id = 'EU-0023-073'
level = 'MUST'
polarity = 'required'
statement = "A run's measures MUST count as stopped improving once they haven't improved beyond their intervals for as many consecutive rounds as the musician's stopping-rule setting sets."
binds_to = 'system'
rationale = 'The musician decides how long a run waits for an improvement, and a run that still improves goes on.'

[[requirement]]
id = 'EU-0023-074'
level = 'MUST'
polarity = 'required'
statement = 'A run MUST end when the interval of each of its measures lies within the tolerance the musician declares.'
binds_to = 'system'
rationale = 'A run stops once its measures are as certain as the musician asks.'

[[requirement]]
id = 'EU-0023-075'
level = 'MUST'
polarity = 'required'
statement = 'A run MUST end when no candidate that reduces its measured difference fits the processing cost the musician accepts.'
binds_to = 'system'
rationale = "A run doesn't go on fitting sounds that cost more processing than the musician accepts."
