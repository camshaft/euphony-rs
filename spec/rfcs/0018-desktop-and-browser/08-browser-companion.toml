[section]
anchor = 'browser-companion'
title = 'The browser companion'
problem = """\
  A musician away from their desktop wants to control a session and listen to its prepared audio \
  without installing anything, but a browser can't record professional audio, run composition \
  programs or reach the local audio network, and a companion that hides this misleads them."""
motivation = """\
  A companion limited to control, inspection and prepared playback, that says what it can't do, \
  offers access without installation and never promises what a browser can't deliver."""
prose = """
The browser companion is the interface euphony serves to a web browser. It connects to an
authorized desktop session through the approved control path, inspects project revisions, sends
commands that the native host runs, and plays prepared audio that it downloads. Prepared audio is
audio the native hosts rendered already, listed in a pinned manifest. A browser can deny a
permission, require a person's gesture before it plays audio, evict stored data, change its audio
device and suspend a page in the background. Local network discovery, multicast audio and network
clock synchronization stay with the native hosts. Narrowing the browser leaves distributed
rendering on native workers and collaboration between native hosts as they are. RFC 0017 states
that the companion doesn't offer offline editing or render on its own."""

[[requirement]]
id = 'EU-0018-058'
level = 'MUST'
polarity = 'required'
statement = 'The browser companion MUST control an authenticated and authorized desktop session through the client protocol.'
binds_to = 'system'
rationale = 'A musician controls a session from a browser without installing anything.'

[[requirement]]
id = 'EU-0018-059'
level = 'MUST'
polarity = 'required'
statement = 'Each command the browser companion sends MUST run on the authorized native host.'
binds_to = 'system'
rationale = 'The browser never holds authority over a project.'

[[requirement]]
id = 'EU-0018-060'
level = 'MUST'
polarity = 'required'
statement = 'The browser companion MUST let a person inspect the revisions of a project.'
binds_to = 'system'
rationale = 'A musician reviews a project from a browser.'

[[requirement]]
id = 'EU-0018-061'
level = 'MUST'
polarity = 'required'
statement = 'The browser companion MUST play downloaded prepared audio that a pinned manifest lists.'
binds_to = 'system'
rationale = 'A musician auditions a project from a browser.'

[[requirement]]
id = 'EU-0018-062'
level = 'MUST'
polarity = 'required'
statement = 'The browser companion MUST verify all audio a manifest requires before it reports playback as ready.'
binds_to = 'system'
rationale = 'Playback that says it is ready never stops for missing audio.'
relations = [ { kind = 'depends_on', target = 'EU-0018-061' } ]

[[requirement]]
id = 'EU-0018-063'
level = 'MUST'
polarity = 'required'
statement = 'The browser companion MUST report each capability it lacks as unavailable.'
binds_to = 'system'
rationale = "A musician knows what the browser can't do instead of finding out by failure."

[[requirement]]
id = 'EU-0018-064'
level = 'MUST'
polarity = 'forbidden'
statement = 'The browser companion MUST NOT run a composition program offline.'
binds_to = 'system'
rationale = 'Every program runs on a native host, with its checks and its timing.'

[[requirement]]
id = 'EU-0018-065'
level = 'MUST'
polarity = 'forbidden'
statement = 'The browser companion MUST NOT record audio locally.'
binds_to = 'system'
rationale = 'Recording stays where professional audio devices and timing are.'

[[requirement]]
id = 'EU-0018-067'
level = 'MUST'
polarity = 'required'
statement = 'When the host is lost, the browser companion MUST keep downloaded prepared audio playable.'
binds_to = 'system'
rationale = 'A musician keeps listening after the connection drops.'

[[requirement]]
id = 'EU-0018-068'
level = 'MUST'
polarity = 'required'
statement = 'When the host is lost, the browser companion MUST show remote commands as unavailable.'
binds_to = 'system'
rationale = "A musician never sends a command that can't arrive."

[[requirement]]
id = 'EU-0018-069'
level = 'MUST'
polarity = 'required'
statement = 'The browser companion MUST report to the person a denied permission, a required gesture to start audio, evicted storage, a changed device and a background suspension.'
binds_to = 'system'
rationale = 'A musician sees why audio or control stopped and what to do.'

[[requirement]]
id = 'EU-0018-070'
level = 'MUST'
polarity = 'required'
statement = 'The prepared player MUST play when memory shared between threads is unavailable.'
binds_to = 'system'
rationale = 'Playback works in every browser setting, not only in the most capable one.'

[[requirement]]
id = 'EU-0018-071'
level = 'MUST'
polarity = 'forbidden'
statement = 'The browser companion MUST NOT claim direct access to local network discovery, multicast audio or network clock synchronization.'
binds_to = 'system'
rationale = 'A browser reaches those only through a native host.'

[[requirement]]
id = 'EU-0018-072'
level = 'MUST'
polarity = 'required'
statement = "The controls of the browser companion MUST be accessible to the browser's assistive technology."
binds_to = 'system'
rationale = 'Every musician can use the companion.'

[[requirement]]
id = 'EU-0018-095'
level = 'MUST'
polarity = 'forbidden'
statement = 'The browser companion MUST NOT claim the monitoring latency of a native host.'
binds_to = 'system'
rationale = 'A musician tests the deadlines a browser actually meets instead of trusting a promise.'
