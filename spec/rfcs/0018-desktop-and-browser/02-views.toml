[section]
anchor = 'views'
title = 'Familiar views and shared commands'
problem = """\
  A musician who learned an established professional workstation expects its arrangement, mixer, \
  piano roll and automation to be where they left them, and an interface that moves them slows \
  every session down."""
motivation = """\
  Views and navigation that follow those conventions, over commands every interface shares, let a \
  musician work from habit, while original artwork keeps the product its own."""
prose = """
The main views follow the conventions that musicians learned on established professional
workstations: the arrangement view, the piano roll and the automation view lay time out from left to
right under a ruler that marks the playhead; the mixer shows a channel strip for each track in the
order of the track list; and one command opens any main view from another at the selected track and
the playhead. A track list, an inspector, a transport, rulers, an asset browser and the composition
editor surround the main views. Recording, punching in, looping, routing, selection, undo and export
are commands that every interface of euphony shares: a view sends them, and doesn't define them.
Familiar workflows are the aim; pixel identity with another product isn't."""

[[requirement]]
id = 'EU-0018-008'
level = 'MUST'
polarity = 'required'
statement = 'The desktop interface MUST provide an arrangement view, a mixer, a piano roll and an automation view.'
binds_to = 'system'
rationale = 'These are the views a musician arranges, mixes and edits in.'

[[requirement]]
id = 'EU-0018-009'
level = 'MUST'
polarity = 'required'
statement = 'From any main view, one command MUST open each other main view at the selected track and the playhead position.'
binds_to = 'system'
rationale = 'A musician moves between the views as established workstations taught them, without losing their place.'

[[requirement]]
id = 'EU-0018-010'
level = 'MUST'
polarity = 'required'
statement = 'The desktop interface MUST provide a track list, an inspector, a transport, rulers, an asset browser and the composition editor beside the main views.'
binds_to = 'system'
rationale = 'The main views are only usable with the panels that surround them.'

[[requirement]]
id = 'EU-0018-011'
level = 'MUST'
polarity = 'required'
statement = 'A musician MUST be able to arrange tracks, edit notes and automation, mix, record and export from the desktop interface.'
binds_to = 'system'
rationale = 'A musician makes a whole piece in the desktop interface.'

[[requirement]]
id = 'EU-0018-012'
level = 'MUST'
polarity = 'required'
statement = 'Recording, punching in, looping, routing, selection, undo and export MUST use the commands every interface of euphony shares.'
binds_to = 'system'
rationale = 'Each action means the same thing whichever interface or assistant takes it.'

[[requirement]]
id = 'EU-0018-013'
level = 'MUST'
polarity = 'forbidden'
statement = 'A view MUST NOT define a command of its own that changes a project.'
binds_to = 'system'
rationale = 'Every change to a project goes through the shared commands, with their checks and history.'
relations = [ { kind = 'depends_on', target = 'EU-0018-012' } ]

[[requirement]]
id = 'EU-0018-096'
level = 'MUST'
polarity = 'required'
statement = 'The arrangement view, the piano roll and the automation view MUST lay time out from left to right under a ruler that marks the playhead.'
binds_to = 'system'
rationale = 'Every timeline reads the same way, so a position in one view is the same position in the others.'

[[requirement]]
id = 'EU-0018-097'
level = 'MUST'
polarity = 'required'
statement = 'The mixer MUST show one channel strip for each track, in the order of the track list.'
binds_to = 'system'
rationale = 'A musician finds the strip of a track where the track list puts the track.'
