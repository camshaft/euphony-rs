[section]
anchor = 'platforms'
title = 'One project on every desktop'
problem = """\
  A musician who moves between computers can't trust a project unless it opens, plays and sounds the \
  same on each desktop operating system, and an interface that ignores each system's own menus, \
  dialogs and services feels foreign wherever it runs."""
motivation = """\
  One project model, one set of commands and one set of conformance cases for every desktop, with \
  each operating system's own services around them, let a musician change computers without \
  learning the interface again or hearing a different result."""
prose = """
The desktop interface is the program a musician runs on a desktop computer to arrange, edit, mix,
record and export a project. euphony supports three desktop operating systems, and the desktop
interface runs on each of them. Each copy of the desktop interface is a client of the session host
through the client protocol, as every other interface is: it shows the project and sends commands,
and the session host accepts or refuses each command. The main views are the arrangement, the
mixer, the piano roll and the automation view. The services of an operating system are its menus,
its file dialogs, its clipboard and drag and drop, its text input and input methods, its window
management and its accessibility services."""

[[requirement]]
id = 'EU-0018-001'
level = 'MUST'
polarity = 'required'
statement = 'The desktop interface MUST run on each desktop operating system euphony supports.'
binds_to = 'system'
rationale = 'A musician works on whichever supported computer they have.'

[[requirement]]
id = 'EU-0018-002'
level = 'MUST'
polarity = 'required'
statement = 'A project MUST open on each supported desktop operating system with the same timing, routing, automation and sound definitions.'
binds_to = 'system'
rationale = 'A project moved to another computer is the same project.'

[[requirement]]
id = 'EU-0018-003'
level = 'MUST'
polarity = 'required'
statement = 'The same revision of a project MUST render the same audio on each supported desktop operating system.'
binds_to = 'system'
rationale = 'The interface a musician uses never changes what the project sounds like.'

[[requirement]]
id = 'EU-0018-004'
level = 'MUST'
polarity = 'required'
statement = "The desktop interface MUST use the operating system's own menus, file dialogs, clipboard, drag and drop, window management and accessibility services."
binds_to = 'system'
rationale = 'The interface behaves as a musician expects every program on that system to behave, and assistive technology reaches it.'

[[requirement]]
id = 'EU-0018-005'
level = 'MUST'
polarity = 'required'
statement = 'Every main view, navigation path and editing command MUST pass the same conformance cases on each supported desktop operating system.'
binds_to = 'system'
rationale = 'The views behave the same on every desktop, and a difference shows as a failed case.'

[[requirement]]
id = 'EU-0018-006'
level = 'MUST'
polarity = 'required'
statement = 'The desktop interface MUST reach the session host only through the client protocol every interface uses.'
binds_to = 'system'
rationale = 'Every interface sees and changes a session the same way.'

[[requirement]]
id = 'EU-0018-007'
level = 'MUST'
polarity = 'forbidden'
statement = 'The desktop interface MUST NOT hold the authority to accept a change to a project.'
binds_to = 'system'
rationale = 'The session host alone accepts changes, so a failed or stale interface never changes a project by itself.'
