[section]
anchor = 'implementations'
title = 'Citing requirements from an implementation'
problem = """\
  Without citations, no one can tell which requirements an implementation meets, which it verifies, \
  and which citations quote words a requirement no longer holds."""
motivation = """\
  Citations that name a requirement by its identifier and quote its statement let the tracing tool \
  compute what each implementation covers, so the gap between the set and the code is read, never \
  written into an RFC."""
prose = """
An implementation cites a requirement in its code or its tests with the tracing tool. A citation
names the rendered text of the section with the identifier as its anchor, and quotes the statement,
so that a changed statement shows each citation that quotes the old words. Which requirements an
implementation implements and verifies is read from the tracing tool's report over its citations.
Each implementation decides how it verifies each requirement, by the tests, proofs or other means its
language offers."""

[[requirement]]
id = 'EU-0000-043'
level = 'MUST'
polarity = 'required'
statement = 'A citation of a requirement MUST name the rendered text of its section with the identifier as the anchor.'
binds_to = 'process'
rationale = 'A citation finds its requirement by identifier, whatever the layout of the text.'

[[requirement]]
id = 'EU-0000-044'
level = 'MUST'
polarity = 'required'
statement = "A citation of a requirement MUST quote the requirement's statement."
binds_to = 'process'
rationale = 'A changed statement shows every citation that is now stale.'

[[requirement]]
id = 'EU-0000-045'
level = 'MUST'
polarity = 'required'
statement = 'An implementation that leaves a requirement unbuilt on purpose MUST say so in its citation of that requirement, with its reason.'
binds_to = 'process'
rationale = 'The set states the whole end state, and each implementation records its gaps where they are.'

[[requirement]]
id = 'EU-0000-046'
level = 'MUST'
polarity = 'forbidden'
statement = "An implementation's tracing configuration MUST NOT list the rendered text as a specification to extract."
binds_to = 'process'
rationale = 'The tracing tool then reads each requirement once, from its requirement file.'
