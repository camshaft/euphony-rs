[section]
anchor = 'rendering'
title = 'Rendered text and requirement files'
problem = """\
  The tracing tool and a person read text, while the sources are structured, so without a rendering \
  that is exact and reproducible a citation could quote words the sources don't hold."""
motivation = """\
  Text and requirement files generated from the sources alone, the same bytes on every run, let the \
  tracing tool read every requirement without extracting it from prose, and put the identifier at \
  the anchor of every quote."""
prose = """
The renderer writes, for each section of each written RFC, one text file under the rendered
location, in a directory named as the directory of the RFC, with the name of the section file and
the extension md. The text opens with a level-two heading of the section title and its anchor, then
the prose, then each requirement as a level-three heading whose title and anchor are its identifier,
followed by its statement as one paragraph. For each requirement the renderer also writes one
requirement file under the requirement location, in the directory of the RFC and then of the
section, named of the identifier with the extension toml. The requirement file states its target,
the location of the text with the identifier as its anchor, and one entry of level and quote. The
tracing tool reads the requirement files directly, and doesn't extract requirements from the
text."""

[[requirement]]
id = 'EU-0000-034'
level = 'MUST'
polarity = 'required'
statement = 'For each section of each written RFC, the renderer MUST write one text file in the rendered location.'
binds_to = 'process'
rationale = 'Each section has one target that citations state.'

[[requirement]]
id = 'EU-0000-035'
level = 'MUST'
polarity = 'required'
statement = 'The rendered text of a section MUST begin with the section title in a heading that carries its anchor.'
binds_to = 'process'
rationale = 'A retitled section keeps its anchor and its citations.'

[[requirement]]
id = 'EU-0000-036'
level = 'MUST'
polarity = 'required'
statement = 'The rendered text of a section MUST hold its prose after its heading and before its requirements.'
binds_to = 'process'
rationale = 'A reader of the text reads the context of the section before its requirements.'

[[requirement]]
id = 'EU-0000-037'
level = 'MUST'
polarity = 'required'
statement = 'The rendered text MUST hold each requirement as a heading of its identifier followed by its statement, in the order of the source.'
binds_to = 'process'
rationale = 'Each requirement is one quotable paragraph under an anchor of its own.'

[[requirement]]
id = 'EU-0000-038'
level = 'MUST'
polarity = 'required'
statement = 'The renderer MUST write, for each requirement, one requirement file that targets the anchor of the requirement in the rendered text.'
binds_to = 'process'
rationale = 'The tracing tool reads the requirements without extracting them.'

[[requirement]]
id = 'EU-0000-039'
level = 'MUST'
polarity = 'required'
statement = "A requirement file MUST hold one entry whose level is the requirement's level and whose quote is its statement without the white space at its ends."
binds_to = 'process'
rationale = 'The tracing tool reports each requirement at its level and compares each citation with the words the source holds.'
relations = [ { kind = 'depends_on', target = 'EU-0000-038' } ]

[[requirement]]
id = 'EU-0000-040'
level = 'MUST'
polarity = 'required'
statement = 'Two renderings of the same sources MUST produce the same bytes.'
binds_to = 'process'
rationale = 'The check compares the generated files with a fresh rendering.'

[[requirement]]
id = 'EU-0000-041'
level = 'MUST'
polarity = 'forbidden'
statement = 'A generated file MUST NOT be written by anything other than the renderer.'
binds_to = 'process'
rationale = 'The sources stay the only place a requirement is written.'

[[requirement]]
id = 'EU-0000-042'
level = 'MUST'
polarity = 'required'
statement = 'The check MUST fail where a generated file differs from a fresh rendering of the sources.'
binds_to = 'process'
rationale = 'A hand edit of a generated file never reaches the default branch.'
relations = [ { kind = 'depends_on', target = 'EU-0000-040' } ]
