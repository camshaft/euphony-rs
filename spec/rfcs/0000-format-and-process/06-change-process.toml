[section]
anchor = 'change-process'
title = 'Changing the set'
problem = """\
  A change that reaches the default branch unchecked or unreviewed can break the consistency of the \
  set or its direction, and a change that waits on anyone beyond its reviewers is held for reasons \
  that have nothing to do with it."""
motivation = """\
  One path for every change, with a check of the change, a review by someone other than its writer, \
  and a merge by the writer once both pass, keeps the default branch consistent and moves each \
  change as soon as it is reviewed."""
prose = """
A change to the set is a pull request against the default branch of the repository. It carries the
edits of the sources and the files the renderer writes from them. A reviewer other than its writer
reads it for consistency, for the format this RFC states, and for the direction of the system, and
the check runs on its last commit. Once the reviewers have approved that commit and the check has
passed on it, the writer merges the change, and the change waits on no other approval."""

[[requirement]]
id = 'EU-0000-047'
level = 'MUST'
polarity = 'required'
statement = 'A change to the set MUST be a pull request against the default branch.'
binds_to = 'process'
rationale = 'Every change follows one path that a reader can find.'

[[requirement]]
id = 'EU-0000-048'
level = 'MUST'
polarity = 'required'
statement = 'A pull request that changes the set MUST carry its source edits together with the files rendered from them.'
binds_to = 'process'
rationale = 'The reviewers read the sources and the text together, and the check compares them.'

[[requirement]]
id = 'EU-0000-049'
level = 'MUST'
polarity = 'required'
statement = 'A change MUST be reviewed by a reviewer other than its writer before it merges.'
binds_to = 'process'
rationale = 'A second reader finds what the check doesn't decide.'

[[requirement]]
id = 'EU-0000-050'
level = 'MUST'
polarity = 'forbidden'
statement = 'The writer of a change MUST NOT approve it.'
binds_to = 'process'
rationale = 'A change, and a weakening of a requirement above all, is never approved by its writer alone.'

[[requirement]]
id = 'EU-0000-051'
level = 'MUST'
polarity = 'required'
statement = 'A change MUST merge only once its check has passed on its last commit.'
binds_to = 'process'
rationale = 'The checked version is the version on the default branch.'

[[requirement]]
id = 'EU-0000-052'
level = 'MUST'
polarity = 'required'
statement = 'A change MUST merge only once each reviewer it asked has approved its last commit.'
binds_to = 'process'
rationale = 'The reviewed version is the version on the default branch.'
relations = [ { kind = 'depends_on', target = 'EU-0000-049' } ]

[[requirement]]
id = 'EU-0000-053'
level = 'MAY'
polarity = 'required'
statement = 'The writer of a reviewed change whose check passed MAY merge it.'
binds_to = 'process'
rationale = 'A reviewed change doesn't wait on anyone else to merge it.'
relations = [ { kind = 'depends_on', target = 'EU-0000-051' }, { kind = 'depends_on', target = 'EU-0000-052' } ]

[[requirement]]
id = 'EU-0000-054'
level = 'MUST'
polarity = 'forbidden'
statement = 'A reviewed change whose check passed MUST NOT wait on an approval other than its reviews.'
binds_to = 'process'
rationale = 'The reviews and the check are the only gates of a change.'

[[requirement]]
id = 'EU-0000-055'
level = 'MUST'
polarity = 'forbidden'
statement = 'A change to the set MUST NOT wait on a build of the code of any implementation.'
binds_to = 'process'
rationale = 'The check of the set is its only build.'

[[requirement]]
id = 'EU-0000-056'
level = 'MUST'
polarity = 'required'
statement = 'A change to a contract requirement MUST be additive or carry a new contract version with a migration path.'
binds_to = 'process'
rationale = 'Components deployed apart keep working across a change of the contract.'

[[requirement]]
id = 'EU-0000-057'
level = 'MUST'
polarity = 'required'
statement = 'Before an RFC first merges, its writer MUST carry into it each change its sources had since they were read.'
binds_to = 'process'
rationale = 'An RFC does not start behind its sources.'
