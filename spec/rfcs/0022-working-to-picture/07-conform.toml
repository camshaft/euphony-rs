[section]
anchor = 'conform'
title = 'Following a new cut'
problem = "Editors send new cuts of the picture while the music is written, and moving every region, marker, automation range and cue to each new cut by hand costs hours and loses work."
motivation = "A change list between two cuts, from the editor's lists or from the sound of the two cuts, and one command that moves everything by it, reports each move, waits on the musician where it is unsure and keeps what it removes, let the musician follow each cut without redoing the work."
prose = """
A new cut arrives as a new video with a change list from the old cut. The change list holds each
segment of the old cut, with the range it moved to in the new cut or its removal, each new segment,
and each segment's confidence. It comes from the editor's lists of both cuts, in the edit list and
timeline formats that video editing programs write, matched event by event through each event's
source reel and source timecode; or, without lists, from the guide tracks of the two cuts, aligned
by comparing short windows of their sound, together with cut detection on both videos. Conforming
moves the project's material onto the new cut by the change list."""

[[requirement]]
id = 'EU-0022-110'
level = 'MUST'
polarity = 'required'
statement = "A person MUST be able to make a change list from the editor's lists of both cuts."
binds_to = 'system'
rationale = "The editor's own lists say exactly what moved."

[[requirement]]
id = 'EU-0022-111'
level = 'MUST'
polarity = 'required'
statement = "A person MUST be able to make a change list from the sound of the guide tracks of both cuts when no lists are given."
binds_to = 'system'
rationale = "A cut that arrives without lists can still be followed."

[[requirement]]
id = 'EU-0022-112'
level = 'MUST'
polarity = 'required'
statement = "Conforming MUST move each region, picture-locked marker, automation range and cue boundary with its segment, in one command."
binds_to = 'system'
rationale = "The whole project follows the new cut in one action."

[[requirement]]
id = 'EU-0022-113'
level = 'MUST'
polarity = 'required'
statement = "A conform MUST be undoable as one command that restores the earlier state exactly."
binds_to = 'system'
rationale = "A conform that went wrong costs nothing."

[[requirement]]
id = 'EU-0022-114'
level = 'MUST'
polarity = 'required'
statement = "Conforming MUST split regions at segment boundaries with short crossfades, 10 milliseconds long by default."
binds_to = 'system'
rationale = "A split region doesn't click."

[[requirement]]
id = 'EU-0022-115'
level = 'MUST'
polarity = 'required'
statement = "Conforming MUST put material over removed picture on a muted lane of its own track."
binds_to = 'system'
rationale = "Material for a removed scene stays at hand if the scene comes back."

[[requirement]]
id = 'EU-0022-116'
level = 'MUST'
polarity = 'forbidden'
statement = "Conforming MUST NOT delete material over removed picture."
binds_to = 'system'
rationale = "No conform loses the musician's work."

[[requirement]]
id = 'EU-0022-117'
level = 'MUST'
polarity = 'required'
statement = "Conforming MUST mark each new segment as a gap."
binds_to = 'system'
rationale = "The musician sees where new picture needs music."

[[requirement]]
id = 'EU-0022-118'
level = 'MUST'
polarity = 'required'
statement = "A segment whose confidence is below the project's threshold MUST be applied only after the person confirms it."
binds_to = 'system'
rationale = "An uncertain match waits for the musician's choice."

[[requirement]]
id = 'EU-0022-119'
level = 'MUST'
polarity = 'forbidden'
statement = "Conforming MUST NOT lengthen or shorten the music."
binds_to = 'system'
rationale = "A change to the music is the composer's choice."

[[requirement]]
id = 'EU-0022-120'
level = 'MUST'
polarity = 'required'
statement = "Conforming MUST report each cue whose picture changed inside its range, with the choices to cut it at a bar, fit its tempo again to the moved hits, or leave it."
binds_to = 'system'
rationale = "The composer decides how each changed cue follows the picture."

[[requirement]]
id = 'EU-0022-121'
level = 'MUST'
polarity = 'required'
statement = "Conforming MUST report every segment and its move."
binds_to = 'system'
rationale = "The musician sees what the conform did."

[[requirement]]
id = 'EU-0022-122'
level = 'MUST'
polarity = 'required'
statement = "The project MUST keep each change list, so that a conform can be compared and repeated."
binds_to = 'system'
rationale = "A conform can be checked and run again later."

[[requirement]]
id = 'EU-0022-123'
level = 'MUST'
polarity = 'required'
statement = "A malformed video, edit list or exchange file MUST be refused without an effect on the session."
binds_to = 'system'
rationale = "A bad file from outside never harms the project or the sound."
