[section]
anchor = "access"
title = "Access and untrusted patches"
problem = "An imported project, a script or a hostile patch can try to reach an unsafe level through feedback, exhaust computing with a large graph, or reveal what a participant isn't allowed to hear."
motivation = "Using the project's existing permissions, treating patches and scripts as untrusted input and enforcing every protection outside the interface keep modulation within the project's existing trust model."
prose = """
Modulation uses the project's existing access rules. The owner's paired devices and connected
assistants create routes. A participant who listens or comments receives only the audio of its
assigned output, which already carries every source mixed into it, so a follower, meter or curve
reveals nothing more. A participant who edits patches its own branch copy. A worker is a paired
computer that receives the inputs its job needs. Patches and scripts are untrusted input."""

[[requirement]]
id = "EU-0012-144"
level = "MUST"
polarity = "forbidden"
statement = "Modulation MUST NOT add a permission of its own."
binds_to = "system"
rationale = "A listener can't learn more through a route than through the audio it already receives."

[[requirement]]
id = "EU-0012-145"
level = "MUST"
polarity = "required"
statement = "The owner's paired devices and connected assistants MUST be able to create any route in the owner's copy of a project."
binds_to = "system"
rationale = "Every client of the owner can patch the owner's project."

[[requirement]]
id = "EU-0012-146"
level = "MUST"
polarity = "forbidden"
statement = "A participant who listens or comments MUST NOT edit routes."
binds_to = "system"
rationale = "Listening never changes a patch."

[[requirement]]
id = "EU-0012-147"
level = "MUST"
polarity = "required"
statement = "A participant who edits MUST patch its own branch copy of the project."
binds_to = "system"
rationale = "A collaborator's patch reaches the owner's copy only through a merge."

[[requirement]]
id = "EU-0012-148"
level = "MUST"
polarity = "required"
statement = "A worker MUST receive only the inputs its job needs."
binds_to = "system"
rationale = "A worker learns no more of a project than it renders."

[[requirement]]
id = "EU-0012-149"
level = "MUST"
polarity = "forbidden"
statement = "A patch or a script MUST NOT pair a device, make a link or take an action that needs the owner's approval without that approval."
binds_to = "system"
rationale = "An untrusted patch never widens access."

[[requirement]]
id = "EU-0012-150"
level = "MUST"
polarity = "required"
statement = "The protections against unsafe feedback, excessive graph expansion and stale compilation MUST be enforced outside the user interface."
binds_to = "system"
rationale = "A client that skips the interface meets the same protections."

[[requirement]]
id = "EU-0012-151"
level = "MUST"
polarity = "required"
statement = "Compiling a graph and allocating its resources MUST happen outside the process that drives the audio device."
binds_to = "system"
rationale = "A large patch never interrupts the device."

[[requirement]]
id = "EU-0012-152"
level = "MUST"
polarity = "required"
statement = "The behavior of routes, conversions, ranges and timing MUST come from project data, not from identities written into code."
binds_to = "system"
rationale = "Every project configures its own patch."
