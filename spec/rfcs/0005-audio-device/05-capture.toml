[section]
anchor = 'capture'
title = 'Input capture and recording'
problem = """\
  A take that is lost with a failed render or a lost device can't be played again, and a take that \
  is out of time with the passage it was played over can't be used."""
motivation = """\
  Keeping the raw input apart from anything rendered, entering it in the project like any other \
  audio, aligning it to the playback it was played against, and letting the musician choose \
  monitoring from the measured latency keeps every performance, and keeps it in time."""
prose = """
While a stream runs, the audio device process captures the input of its device. Recording keeps
the raw input apart from any audio rendered from the project: rendered audio can be calculated
again, and a performance can't. A take enters the project as regions of the same immutable model as
any other audio. Each recorded sample is aligned with the sample of playback it was recorded
against, so a take sounds in time with the passage it was played over. The process measures the
round-trip latency of the active device, and the musician chooses a monitoring mode after seeing
it; euphony doesn't promise a latency of its own."""

[[requirement]]
id = 'EU-0005-041'
level = 'MUST'
polarity = 'required'
statement = 'Recording MUST keep the raw input it captures independently of any rendered output.'
binds_to = 'system'
rationale = 'A performance outlives every render made from it.'

[[requirement]]
id = 'EU-0005-042'
level = 'MUST'
polarity = 'required'
statement = 'A recorded take MUST enter the project as regions of the same immutable model as other audio.'
binds_to = 'system'
rationale = 'A take is edited, rendered, shared and kept like any other audio.'

[[requirement]]
id = 'EU-0005-043'
level = 'MUST'
polarity = 'required'
statement = 'Each recorded sample MUST be aligned with the sample of playback it was recorded against.'
binds_to = 'system'
rationale = 'A take sounds in time with the passage it was played over.'

[[requirement]]
id = 'EU-0005-044'
level = 'MUST'
polarity = 'required'
statement = 'The audio device process MUST measure the round-trip latency of the active device.'
binds_to = 'system'
rationale = 'Euphony states a latency it measured, not one it assumed.'

[[requirement]]
id = 'EU-0005-045'
level = 'MUST'
polarity = 'required'
statement = 'Euphony MUST show the musician the measured round-trip latency of the active device before the musician chooses a monitoring mode.'
binds_to = 'system'
rationale = 'The musician chooses monitoring from the latency of their own device.'
relations = [ { kind = 'depends_on', target = 'EU-0005-044' } ]

[[requirement]]
id = 'EU-0005-046'
level = 'MUST'
polarity = 'required'
statement = 'Input captured before the loss of a device MUST stay in the recording.'
binds_to = 'system'
rationale = "A lost device doesn't take the take with it."
