[section]
anchor = 'callback'
title = 'The real-time callback'
problem = """\
  A callback that waits on anything outside itself misses the deadline of the device, and a click \
  or a gap reaches what the musician plays and records."""
motivation = """\
  A callback that only hands over work prepared ahead of time, and never waits, meets every \
  deadline the device sets, whatever else the computer is doing."""
prose = """
The device asks the audio device process for each period of audio, and the callback fills the
output of the period and takes its input before the deadline of the device. Everything the callback
reads is ready before it runs: the session host delivers buffers whose memory is already allocated,
and each compiled graph revision before the callback plays it. The callback passes buffers and
revisions to and from the session host without either side waiting on the other. Work whose time
has no bound, such as a read of storage, a call to another computer, or allocating or releasing
memory, happens outside the callback. The callback counts positions in whole samples; exact musical
time is resolved to samples before a revision reaches it."""

[[requirement]]
id = 'EU-0005-010'
level = 'MUST'
polarity = 'forbidden'
statement = 'The callback MUST NOT make a network call.'
binds_to = 'system'
rationale = 'A network delay never reaches the deadline of the device.'

[[requirement]]
id = 'EU-0005-011'
level = 'MUST'
polarity = 'forbidden'
statement = 'The callback MUST NOT allocate memory.'
binds_to = 'system'
rationale = 'Allocating memory can take time without a bound.'

[[requirement]]
id = 'EU-0005-012'
level = 'MUST'
polarity = 'forbidden'
statement = 'The callback MUST NOT release memory.'
binds_to = 'system'
rationale = 'Releasing memory can take time without a bound, so old buffers and revisions are released outside the callback.'

[[requirement]]
id = 'EU-0005-013'
level = 'MUST'
polarity = 'forbidden'
statement = 'The callback MUST NOT acquire a lock whose wait has no bound.'
binds_to = 'system'
rationale = 'A lock held elsewhere never holds up the device.'

[[requirement]]
id = 'EU-0005-014'
level = 'MUST'
polarity = 'forbidden'
statement = 'The callback MUST NOT read or write storage.'
binds_to = 'system'
rationale = 'A storage access can take time without a bound.'

[[requirement]]
id = 'EU-0005-015'
level = 'MUST'
polarity = 'required'
statement = 'The session host MUST deliver each buffer the callback uses with its memory already allocated.'
binds_to = 'system'
rationale = 'The callback fills and reads buffers without allocating.'
relations = [ { kind = 'depends_on', target = 'EU-0005-011' } ]

[[requirement]]
id = 'EU-0005-016'
level = 'MUST'
polarity = 'required'
statement = 'The session host MUST deliver each compiled graph revision to the audio device process before the callback plays it.'
binds_to = 'system'
rationale = 'The callback starts a revision without compiling or waiting for it.'

[[requirement]]
id = 'EU-0005-017'
level = 'MUST'
polarity = 'forbidden'
statement = 'Passing a buffer or a revision between the session host and the callback MUST NOT make either side wait on the other.'
binds_to = 'system'
rationale = 'Neither the session host nor the callback is held up by the other.'

[[requirement]]
id = 'EU-0005-018'
level = 'MUST'
polarity = 'required'
statement = 'The callback MUST count positions in whole samples.'
binds_to = 'system'
rationale = "A position doesn't drift from rounding inside the callback, and exact musical time stays with the compiler."
