[section]
anchor = 'held-notes'
title = 'Note ownership and release'
problem = """\
  A note-off that misses its note-on's destination, a lost device, or a channel-wide reset that one \
  route sends over another route's channel leaves notes stuck on, or cuts off notes another route is \
  holding."""
motivation = """\
  A ledger of each note every route started, and a reset that only a channel's owner can send, \
  release exactly the notes a route started and no others, whatever changed since they began."""
prose = """
The note ledger records each note-on a route emits, by input device, port, channel, occurrence of
the input note and route generation, with the exact destinations and output pitches it produced.
Repeated note-ons of one pitch, and several input pitches projected onto one output pitch, are
counted by occurrence and by destination, so that one release stops only the note it belongs to.
Sustain and other held controllers are channel state that the route which set them owns. A
channel-wide reset is a message that affects every note or controller of a channel, such as all
notes off. A route owns a destination channel exclusively where the channel allocation of the
session assigns that channel to it alone in the current session generation. A reset-sensitive route
is one whose recovery sends a channel-wide reset. An instrument is reachable while the transport to
it carries events."""

[[requirement]]
id = 'EU-0016-054'
level = 'MUST'
polarity = 'required'
statement = 'The session host MUST record each note-on a route emits in the note ledger with the exact destinations and pitches it produced.'
binds_to = 'system'
rationale = 'Every release can find the notes it has to stop.'

[[requirement]]
id = 'EU-0016-055'
level = 'MUST'
polarity = 'required'
statement = 'A note-off MUST release the destinations and pitches its note-on produced, whatever key, route or transform edit came between them.'
binds_to = 'system'
rationale = 'A live edit never leaves a note held under the old mapping.'
relations = [ { kind = 'depends_on', target = 'EU-0016-054' } ]

[[requirement]]
id = 'EU-0016-056'
level = 'MUST'
polarity = 'required'
statement = 'A note-on with zero velocity MUST be read as a release.'
binds_to = 'system'
rationale = 'Devices that release notes this way never leave notes sounding.'

[[requirement]]
id = 'EU-0016-057'
level = 'MUST'
polarity = 'forbidden'
statement = 'A release MUST NOT stop a note that another note-on still holds.'
binds_to = 'system'
rationale = 'Repeated notes and notes projected onto one pitch each end when their own key is released.'

[[requirement]]
id = 'EU-0016-058'
level = 'MUST'
polarity = 'required'
statement = 'A route MUST own the sustain and other held controller state it sets on a channel.'
binds_to = 'system'
rationale = 'A route that stops can clear exactly the held state it set.'

[[requirement]]
id = 'EU-0016-059'
level = 'MUST'
polarity = 'required'
statement = "Before it activates a route's new generation, the session host MUST release each note and controller the old generation owns."
binds_to = 'system'
rationale = 'Replacing a route never leaves the old route sounding.'

[[requirement]]
id = 'EU-0016-060'
level = 'MUST'
polarity = 'required'
statement = 'The session host MUST discard the pending events of a route generation it replaces.'
binds_to = 'system'
rationale = 'An event queued for an old route never plays through the new one.'

[[requirement]]
id = 'EU-0016-061'
level = 'MUST'
polarity = 'required'
statement = 'When a port is removed, its transport fails, its host is lost or its host is unpaired, the session host MUST mark each route over it unavailable.'
binds_to = 'system'
rationale = 'A musician sees which routes stopped and why.'

[[requirement]]
id = 'EU-0016-062'
level = 'MUST'
polarity = 'required'
statement = 'When a route becomes unavailable, the session host MUST release each note the route owns wherever its instrument is still reachable.'
binds_to = 'system'
rationale = 'A dropped device never leaves notes stuck on.'
relations = [ { kind = 'depends_on', target = 'EU-0016-054' } ]

[[requirement]]
id = 'EU-0016-063'
level = 'MUST'
polarity = 'forbidden'
statement = 'The loss of a port, a transport or a host MUST NOT stop other routes, audio playback or capture.'
binds_to = 'system'
rationale = 'One device dropping off never stops the session.'

[[requirement]]
id = 'EU-0016-064'
level = 'MUST'
polarity = 'required'
statement = "The output adapter MUST refuse each channel-wide reset from a route that doesn't own the destination channel exclusively in the current session generation."
binds_to = 'system'
rationale = 'One route never cuts off the notes another route holds on a shared channel.'

[[requirement]]
id = 'EU-0016-065'
level = 'MUST'
polarity = 'required'
statement = 'The output adapter MUST emit a typed refusal event for each channel-wide reset it refuses.'
binds_to = 'system'
rationale = 'A refused reset is visible, not silent.'

[[requirement]]
id = 'EU-0016-066'
level = 'MUST'
polarity = 'required'
statement = 'The output adapter MUST read the channel allocation at the moment it emits a channel-wide reset, whichever transform or recovery path requested it.'
binds_to = 'system'
rationale = 'A concurrent route change never turns an earlier allowed reset into one that affects another route.'
relations = [ { kind = 'depends_on', target = 'EU-0016-064' } ]

[[requirement]]
id = 'EU-0016-067'
level = 'MUST'
polarity = 'required'
statement = 'The session host MUST give each reset-sensitive route an exclusive destination channel or refuse the route.'
binds_to = 'system'
rationale = 'A route that needs a reset to recover never shares a channel it would clear.'

[[requirement]]
id = 'EU-0016-068'
level = 'MUST'
polarity = 'required'
statement = "Where a remote synthesizer is unreachable, the session host MUST record that its sounding notes can't be cleared remotely."
binds_to = 'system'
rationale = 'A musician knows which synthesizer may still be sounding.'

[[requirement]]
id = 'EU-0016-069'
level = 'MUST'
polarity = 'required'
statement = 'On reconnection, the session host MUST clear the remote note and controller state its routes own before it admits new notes.'
binds_to = 'system'
rationale = 'A synthesizer that comes back starts from a clean state.'

[[requirement]]
id = 'EU-0016-070'
level = 'MUST'
polarity = 'required'
statement = 'A reconnection MUST start a new session generation.'
binds_to = 'system'
rationale = 'Events and resets of the old connection are told apart from new ones.'

[[requirement]]
id = 'EU-0016-071'
level = 'MUST'
polarity = 'forbidden'
statement = 'The session host MUST NOT replay a buffered performance or controller gesture after a reconnection.'
binds_to = 'system'
rationale = 'Notes played into a dead connection never burst out when it returns.'

[[requirement]]
id = 'EU-0016-072'
level = 'MUST'
polarity = 'required'
statement = 'A host MUST send, on teardown, session timeout and source loss, a note-off for each note-on it forwarded without one.'
binds_to = 'system'
rationale = 'Notes are released at the edge of the network too, where the session host can no longer reach them.'

[[requirement]]
id = 'EU-0016-073'
level = 'MUST'
polarity = 'forbidden'
statement = 'A MIDI host MUST NOT send a channel-wide reset.'
binds_to = 'system'
rationale = 'Only the output adapter, which knows the channel allocation, decides a channel-wide reset.'
