[section]
anchor = 'commands'
title = 'Commands and their outcomes'
problem = """\
  Where each interface, script and assistant changes a project in a way of its own, they apply \
  different checks, a retried request is applied twice, and an edit made against an old state \
  overwrites a newer one without anyone seeing it."""
motivation = """\
  One typed command for each change, checked the same way whoever sends it and applied whole or not \
  at all against the revision its sender read, lets every way into euphony reach the same results."""
prose = """
Every change a person or an assistant makes to a project is a command. Commands are sent in batches.
A batch names the project, the branch it changes, the revision its sender expects to change on that
branch, a key that identifies the batch across retries, and the actor that sends it. The actor is the
caller that euphony authenticated, and euphony refuses as denied a batch that names another actor
before it reads any batch of that actor. euphony also refuses as denied a batch whose caller may not
take its commands on the branch it names, before it checks the batch's commands against the project
schema, its expected revision or its key. It refuses a batch that names a project that doesn't exist
in the same way and at the same point of its checks, so that a refusal doesn't tell a caller whether
the project exists. euphony then refuses as invalid input a batch whose expected revision isn't in
the history of the branch it names. euphony answers that check with a fixed number of reads, each
bounded by an index, however long the branch's history is. euphony checks each batch against the
access rules that the overview RFC states and the project schema, and then commits it whole as a
new revision, or
refuses it whole with a typed reason: a conflict, a denial, invalid input or unavailable storage. A
conflict carries, at the head of the batch's branch, the view of each part of the project that the
batch's commands name or change and that its actor may read, with that part's own fields and the
identities of the parts it holds that its actor may read; it names that head to an actor who may
read the branch, and the sender reads the rest of the project in pages, as the revisions section
states. A gesture in an interface, a line of a script, the result of a composition program and the
call of an assistant all reach the project as such batches. A change of presentation that leaves the
project as it was, such as scrolling, isn't a command. The protocol that carries batches to euphony
is the subject of the client protocol RFC. A key identifies a batch only among the batches one actor
sends to one project: a retry of a committed batch on the same branch receives that batch's outcome,
unless euphony refuses it as denied first, as it does once its caller may no longer change the
project, and a key used again for another branch or other commands is refused."""

[[requirement]]
id = 'EU-0004-009'
level = 'MUST'
polarity = 'required'
statement = 'Each persistent change to a project MUST be made by a command.'
binds_to = 'system'
rationale = 'Every change is checked, recorded and reachable from every way into euphony.'

[[requirement]]
id = 'EU-0004-010'
level = 'MUST'
polarity = 'required'
statement = 'Each command MUST have a type that the command schema of euphony defines.'
binds_to = 'system'
rationale = 'Every interface, script and assistant reads the same definition of each command.'

[[requirement]]
id = 'EU-0004-011'
level = 'MUST'
polarity = 'required'
statement = 'A batch MUST name its project, the branch it changes, its expected revision, its idempotency key and its actor.'
binds_to = 'system'
rationale = 'euphony knows what the batch changes, on which branch, against which state, across retries and for whom.'

[[requirement]]
id = 'EU-0004-049'
level = 'MUST'
polarity = 'required'
statement = "Where the actor that a batch names is not the caller that euphony authenticated, euphony MUST refuse the batch as denied before it checks the batch's expected revision or its idempotency key."
binds_to = 'system'
rationale = 'No sender records a change as another actor, or learns from a refusal or a retry which keys another actor used.'
relations = [ { kind = 'depends_on', target = 'EU-0004-011' } ]

[[requirement]]
id = 'EU-0004-056'
level = 'MUST'
polarity = 'required'
statement = "Where the caller that euphony authenticated may not take every command of a batch on the branch that the batch names, euphony MUST refuse the batch as denied before it checks the batch's commands against the project schema, its expected revision or its idempotency key."
binds_to = 'system'
rationale = "A caller that may not take a batch's commands on its branch doesn't learn from a conflict, from a refusal of invalid input or from a retry whether that branch's head moved or which keys its actors used, and a caller that may not change the project at all doesn't learn that it exists."
relations = [ { kind = 'depends_on', target = 'EU-0004-011' } ]

[[requirement]]
id = 'EU-0004-064'
level = 'MUST'
polarity = 'required'
statement = "Where the expected revision of a batch is neither the head of the branch that the batch names nor a revision that this head follows, directly or through other revisions, euphony MUST refuse the batch as invalid input after the check of EU-0004-056 and before it checks the batch's idempotency key."
binds_to = 'system'
rationale = 'The access check and the commit read the same branch, a revision of another branch never chooses the branch that a batch changes, and a caller that may change the branch gets the same answer whether its expected revision is on another branch or is not a revision at all.'
relations = [ { kind = 'depends_on', target = 'EU-0004-011' }, { kind = 'depends_on', target = 'EU-0004-056' } ]

[[requirement]]
id = 'EU-0004-059'
level = 'MUST'
polarity = 'required'
statement = "Where the project that a batch names does not exist, euphony MUST refuse the batch as denied before it checks the batch's commands against the project schema, its expected revision or its idempotency key, with a refusal whose kind and content, apart from the values the batch itself supplies, are those of its refusal of EU-0004-056 of a batch whose caller may not take its commands on the branch it names."
binds_to = 'system'
rationale = "A refusal of a batch doesn't tell its sender which projects exist."
relations = [ { kind = 'depends_on', target = 'EU-0004-056' } ]

[[requirement]]
id = 'EU-0004-067'
level = 'MUST'
polarity = 'required'
statement = "euphony MUST make the check of EU-0004-064 with a fixed number of reads, each bounded by an index and returning a fixed number of records, whatever the length of the history of the branch that the batch names."
binds_to = 'system'
rationale = "Every edit runs this check, so a batch on a project with a long history costs what it costs on a new one: euphony answers it from a record kept for the purpose, such as a record of the revisions that each branch's head follows, merged revisions among them, and doesn't walk the history from the head."
relations = [ { kind = 'depends_on', target = 'EU-0004-064' } ]

[[requirement]]
id = 'EU-0004-012'
level = 'MUST'
polarity = 'required'
statement = 'euphony MUST check every command of a batch against the project schema before it commits the batch.'
binds_to = 'system'
rationale = 'An invalid change never reaches a revision.'
relations = [ { kind = 'depends_on', target = 'EU-0004-010' } ]

[[requirement]]
id = 'EU-0004-013'
level = 'MUST'
polarity = 'required'
statement = 'A batch MUST commit whole or not at all.'
binds_to = 'system'
rationale = 'A project never holds half of a change.'

[[requirement]]
id = 'EU-0004-014'
level = 'MUST'
polarity = 'required'
statement = 'A committed batch MUST produce exactly one new revision.'
binds_to = 'system'
rationale = 'Each change can be named, read and undone as one revision.'

[[requirement]]
id = 'EU-0004-015'
level = 'MUST'
polarity = 'required'
statement = 'The outcome of a committed batch MUST identify the revision it committed and the changes it made.'
binds_to = 'system'
rationale = 'A sender that reports success can point at what it changed.'
relations = [ { kind = 'depends_on', target = 'EU-0004-014' } ]

[[requirement]]
id = 'EU-0004-016'
level = 'MUST'
polarity = 'required'
statement = 'The outcome of a refused batch MUST be one of conflict, denied, invalid input or unavailable storage.'
binds_to = 'system'
rationale = 'A sender acts on a typed reason, not on the words of a message.'

[[requirement]]
id = 'EU-0004-017'
level = 'MUST'
polarity = 'required'
statement = 'Where the expected revision of a batch is not the head of the branch that the batch names, and no committed batch of the same project and actor holds its idempotency key, euphony MUST refuse the batch as a conflict.'
binds_to = 'system'
rationale = 'An edit made against an old state never overwrites a newer one, and a retry of a batch whose first send committed after the head moved never reads as a conflict.'
relations = [ { kind = 'depends_on', target = 'EU-0004-011' } ]

[[requirement]]
id = 'EU-0004-018'
level = 'MUST'
polarity = 'required'
statement = "A conflict MUST include, at the head of the batch's branch, the view of each part of the project that a command of the batch names or changes and that the actor of the batch may read, holding that part's own fields and the identities of the parts it holds that the actor of the batch may read, without their contents."
binds_to = 'system'
rationale = 'The sender chooses whether to compute its change again from the state it changes, and the answer to a conflict grows with the batch, not with the project or with a track.'
relations = [ { kind = 'depends_on', target = 'EU-0004-017' } ]

[[requirement]]
id = 'EU-0004-051'
level = 'MUST'
polarity = 'required'
statement = "Where the actor of a batch may read the batch's branch, a conflict MUST identify the head revision of that branch."
binds_to = 'system'
rationale = 'The sender sends that revision as the expected revision of its next batch, and a sender who may not read the branch learns nothing of it from a conflict.'
relations = [ { kind = 'depends_on', target = 'EU-0004-017' } ]

[[requirement]]
id = 'EU-0004-019'
level = 'MUST'
polarity = 'forbidden'
statement = 'A batch with the project, actor and idempotency key of a committed batch MUST NOT be applied again.'
binds_to = 'system'
rationale = 'A retry after a lost answer, or after a reconnection, never repeats an edit.'
relations = [ { kind = 'depends_on', target = 'EU-0004-011' } ]

[[requirement]]
id = 'EU-0004-020'
level = 'MUST'
polarity = 'required'
statement = 'A batch sent again with the project, branch, actor, idempotency key and commands of a committed batch MUST receive the outcome of that committed batch, except where euphony refuses it as denied before it checks its idempotency key, as EU-0004-049 and EU-0004-056 do, such as a retry from a caller who lost change access after that batch committed.'
binds_to = 'system'
rationale = "A sender whose answer was lost learns what happened, and a caller that may no longer change the project doesn't learn it from a retry."
relations = [ { kind = 'depends_on', target = 'EU-0004-049' }, { kind = 'depends_on', target = 'EU-0004-056' } ]

[[requirement]]
id = 'EU-0004-046'
level = 'MUST'
polarity = 'required'
statement = 'Where a batch has the project, actor and idempotency key of a committed batch and names another branch or other commands, euphony MUST refuse the batch as invalid input.'
binds_to = 'system'
rationale = 'A key used again for another change is never read as a retry, and is never applied as a new batch.'
relations = [ { kind = 'depends_on', target = 'EU-0004-011' } ]

[[requirement]]
id = 'EU-0004-047'
level = 'MUST'
polarity = 'forbidden'
statement = 'euphony MUST NOT answer a batch with the outcome of a committed batch of another actor or another project.'
binds_to = 'system'
rationale = "A sender that learns the key of another actor never reads that actor's changes through a retry."
relations = [ { kind = 'depends_on', target = 'EU-0004-020' } ]

[[requirement]]
id = 'EU-0004-021'
level = 'MUST'
polarity = 'required'
statement = 'A change MUST pass the same checks whichever interface, command line, script, composition program or assistant sends it.'
binds_to = 'system'
rationale = 'Every way into euphony has the same results.'

[[requirement]]
id = 'EU-0004-022'
level = 'MUST'
polarity = 'required'
statement = 'Each committed batch MUST be undoable by a later batch.'
binds_to = 'system'
rationale = 'A musician or an assistant takes back any change and keeps the history.'

[[requirement]]
id = 'EU-0004-023'
level = 'MUST'
polarity = 'forbidden'
statement = 'A change of presentation that leaves the project as it was MUST NOT produce a revision.'
binds_to = 'system'
rationale = 'Scrolling and focus never fill the history or change the sound.'

[[requirement]]
id = 'EU-0004-024'
level = 'MUST'
polarity = 'required'
statement = 'Where a command starts work that ends after its batch commits, the outcome of the batch MUST identify that work apart from the revision.'
binds_to = 'system'
rationale = 'A pending render is never reported as a finished export.'
