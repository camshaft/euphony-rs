[section]
anchor = 'effects'
title = 'Effect settings'
problem = """\
  The settings of its effects make a mix sound as it does, and a source project stores them in each \
  vendor's own layout, so a conversion that guesses them is wrong and one that loads the effect \
  itself is unsafe."""
motivation = """\
  Versioned mappings that convert each control exactly by what it is, and an import that never runs \
  a source effect and keeps what it can't read, carry over every setting that can be carried and \
  report every one that can't."""
prose = """
An effect here means an effect or an instrument of a track. An effect of a source project carries
over to a built-in effect where a mapping covers it. A mapping is versioned data: it identifies the
source effect and the version of its settings, selects the built-in effect that replaces it, and
converts each control's value and automation exactly, by what the control is and not by how it
looks. Some effects store settings that only the effect itself can read; the import never runs such
an effect, so it keeps the effect's identity and settings as they were and reports it as not
converted. A control converts exactly only where its position, unit and range at the source
project's format version are known."""

[[requirement]]
id = 'EU-0014-050'
level = 'MUST'
polarity = 'required'
statement = 'The import MUST identify each effect of a source project by its vendor, its identifier and the version of its settings schema.'
binds_to = 'system'
rationale = 'Each mapping applies only to the effect and the settings version it was made for.'

[[requirement]]
id = 'EU-0014-051'
level = 'MUST'
polarity = 'required'
statement = 'A mapping MUST name the version of the built-in effect that replaces each source effect it covers.'
binds_to = 'system'
rationale = 'A render of the replacement is reproducible.'

[[requirement]]
id = 'EU-0014-052'
level = 'MUST'
polarity = 'required'
statement = 'A mapping MUST convert each control by its identity, unit, range, enumeration, normalization and conversion curve.'
binds_to = 'system'
rationale = 'Each converted control sets the same value it had.'

[[requirement]]
id = 'EU-0014-053'
level = 'MUST'
polarity = 'forbidden'
statement = 'A mapping MUST NOT match a control by its display label or its knob position.'
binds_to = 'system'
rationale = 'Two controls that look alike can differ in unit, range and curve.'

[[requirement]]
id = 'EU-0014-054'
level = 'MUST'
polarity = 'required'
statement = "The import MUST carry each mapped control's automation, with its event positions and interpolation, to the built-in replacement."
binds_to = 'system'
rationale = 'Recorded changes to an effect play on its replacement as they did.'

[[requirement]]
id = 'EU-0014-055'
level = 'MUST'
polarity = 'required'
statement = 'The import MUST check every control of a source effect against its mapping.'
binds_to = 'system'
rationale = "A control is never converted by a mapping that doesn't fit it."

[[requirement]]
id = 'EU-0014-056'
level = 'MUST'
polarity = 'required'
statement = 'The import MUST report each control value that its mapping leaves missing or ambiguous.'
binds_to = 'system'
rationale = "The musician sees each setting the conversion couldn't decide."
relations = [ { kind = 'depends_on', target = 'EU-0014-055' } ]

[[requirement]]
id = 'EU-0014-057'
level = 'MUST'
polarity = 'required'
statement = "The import MUST keep the raw settings of each source effect on the musician's own computer, for a later import."
binds_to = 'system'
rationale = 'A later mapping can convert the effect from the settings the import kept, and the settings never leave the computer they were read on.'

[[requirement]]
id = 'EU-0014-058'
level = 'MUST'
polarity = 'forbidden'
statement = 'The import MUST NOT run a source effect to read its settings.'
binds_to = 'system'
rationale = "Loading another vendor's effect could run code on the musician's computer that the import can't check."

[[requirement]]
id = 'EU-0014-059'
level = 'MUST'
polarity = 'required'
statement = "An effect whose settings can't be read without running it MUST import as its identity, slot position and preset name, with its settings kept unchanged."
binds_to = 'system'
rationale = 'The musician sees which effect stood in the slot, and its settings wait for a later conversion.'
relations = [ { kind = 'depends_on', target = 'EU-0014-058' } ]

[[requirement]]
id = 'EU-0014-060'
level = 'MUST'
polarity = 'required'
statement = "The import MUST report as unmapped each control of a source effect whose position, unit and range it doesn't know at the source project's format version."
binds_to = 'system'
rationale = 'Only a control whose meaning is known converts exactly.'

[[requirement]]
id = 'EU-0014-061'
level = 'MUST'
polarity = 'forbidden'
statement = "The import MUST NOT put a default value in place of a setting it can't read."
binds_to = 'system'
rationale = "A setting the import couldn't read is never silently replaced."

[[requirement]]
id = 'EU-0014-062'
level = 'MUST'
polarity = 'required'
statement = 'Each mapping MUST carry a version.'
binds_to = 'system'
rationale = 'A new source version or effect is added as a new mapping version, and an import records which one it used.'

[[requirement]]
id = 'EU-0014-076'
level = 'MUST'
polarity = 'required'
statement = "A mapping MUST carry each mapped effect's bypass state, channel layout, routing and modulation sources to its built-in replacement."
binds_to = 'system'
rationale = 'The replacement takes the same place in the signal flow and follows the same sources.'
