[section]
anchor = 'scope'
title = 'Imported projects and the project format'
problem = """\
  A musician with years of projects saved in another music workstation can move to euphony only if \
  those projects open with what they made in them, while euphony's own records, such as its revision \
  history and composition programs, can't depend on a format whose vendor doesn't publish it."""
motivation = """\
  Keeping every project in euphony's own format, and bringing another workstation's projects in \
  through an import that never changes the original, keeps euphony's records whole and leaves the \
  musician the original project to return to."""
prose = """
An import reads a project saved by another music workstation, called the source project here, and
proposes a euphony project built from it. The source workstation's format isn't published, and what
is known of it holds for the format versions that were measured. euphony keeps every project in its
own format, which stays the authoritative copy after an import. euphony doesn't send projects back
to a source workstation: a musician who wants to return keeps the source project, which the import
leaves as it was. Rendered audio, stems or notes exported for other programs aren't a project in a
source workstation's format, and other RFCs state them. The import and its reports serve the
owner's desktop interface and connected assistants alike, through the commands every client uses."""

[[requirement]]
id = 'EU-0014-001'
level = 'MUST'
polarity = 'required'
statement = "An imported project MUST be kept in euphony's own project format."
binds_to = 'system'
rationale = 'Revisions, composition programs and merges never depend on what a source format preserves.'

[[requirement]]
id = 'EU-0014-002'
level = 'MUST'
polarity = 'required'
statement = 'The import MUST leave the source project unchanged.'
binds_to = 'system'
rationale = 'A musician keeps the source project, and with it a way back to the source workstation.'

[[requirement]]
id = 'EU-0014-003'
level = 'MUST'
polarity = 'forbidden'
statement = 'euphony MUST NOT write a project in the format of a source workstation.'
binds_to = 'system'
rationale = "A source workstation can't play euphony's built-in effects or captured gear, so a project written in its format wouldn't sound the same."

[[requirement]]
id = 'EU-0014-004'
level = 'MUST'
polarity = 'required'
statement = 'A request for a project in the format of a source workstation MUST be answered with an error.'
binds_to = 'system'
rationale = 'A client never receives a file that claims to be a project in that format.'
relations = [ { kind = 'depends_on', target = 'EU-0014-003' } ]

[[requirement]]
id = 'EU-0014-005'
level = 'MUST'
polarity = 'required'
statement = "The import and its reports MUST be available equally to the owner's desktop interface and to connected assistants."
binds_to = 'system'
rationale = 'The musician and their assistants see and drive the same import.'
