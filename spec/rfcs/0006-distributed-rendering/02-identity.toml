[section]
anchor = 'identity'
title = 'Render descriptors and result identity'
problem = """\
  A cache that keys a result on less than every input of its calculation serves audio rendered from \
  other inputs, and a host that trusts a result by its name alone plays corrupt or foreign audio."""
motivation = """\
  Two identities, one for the requested calculation and one for its result, let any \
  worker render any request, let equal requests render once, and let the host accept a result only \
  once it is checked."""
prose = """
A render descriptor is the canonical description of one requested calculation. It holds the schema
version, the digest of each source, the transforms of each region, the tempo map, the automation,
the routing, the descriptor of every upstream calculation, the version of each processor and of its
parameters, the sample rate, the channel layout, the precision of each internal stage, each random
seed, the render mode, the identity of the checkpoint the calculation starts from, and the requested
range with its preroll and its tails. A result is an item of the content store, and its identity is
the digest RFC 0008 computes for that item. A render
profile names one executable and numerical behavior, since different processors, vector
instructions and browser builds don't yield the same floating-point bytes; workers share a profile
only where they yield the same bytes for the same descriptor. The repeatability suite of a render
profile is a fixed set of render descriptors, each with the digest of the result that the profile
yields for it. A worker passes the suite where, for every descriptor of the suite, it renders a
result whose digest equals the digest the suite records. The manifest of a revision maps each
descriptor the revision needs to at most one validated result and pins that result. A digest
establishes a result's identity, not trust in it."""

[[requirement]]
id = 'EU-0006-011'
level = 'MUST'
polarity = 'required'
statement = 'Each render request MUST be identified by its render descriptor.'
binds_to = 'system'
rationale = 'Every worker reads the same request in the same way.'

[[requirement]]
id = 'EU-0006-012'
level = 'MUST'
polarity = 'required'
statement = 'A render descriptor MUST hold every input that can change the bytes of its result.'
binds_to = 'system'
rationale = 'A change of any input, a processor or precision version among them, invalidates the results it affects.'

[[requirement]]
id = 'EU-0006-013'
level = 'MUST'
polarity = 'forbidden'
statement = 'A render descriptor MUST NOT hold the identity of a worker or a wall-clock time.'
binds_to = 'system'
rationale = 'The same calculation has the same descriptor wherever and whenever it runs.'

[[requirement]]
id = 'EU-0006-015'
level = 'MUST'
polarity = 'required'
statement = 'A request whose descriptor and render profile equal those of a held validated result MUST be served from that result without rendering again.'
binds_to = 'system'
rationale = 'Equal calculations render once.'
relations = [ { kind = 'depends_on', target = 'EU-0006-011' } ]

[[requirement]]
id = 'EU-0006-016'
level = 'MUST'
polarity = 'required'
statement = 'Each random source of a calculation MUST be named in its render descriptor with its seed and its version.'
binds_to = 'system'
rationale = 'Noise and other random processing yield the same bytes on every compatible worker.'

[[requirement]]
id = 'EU-0006-017'
level = 'MUST'
polarity = 'forbidden'
statement = "A result MUST NOT hold processing that its render descriptor doesn't record."
binds_to = 'system'
rationale = 'No hidden processing, such as a filter applied to every stored sound, changes audio outside the descriptor.'

[[requirement]]
id = 'EU-0006-018'
level = 'MUST'
polarity = 'required'
statement = "A worker MUST share a render profile with other workers only once, for every descriptor of that profile's repeatability suite, it renders a result whose digest equals the digest the suite records."
binds_to = 'system'
rationale = 'Workers that share a profile yield the same bytes for the same descriptor.'

[[requirement]]
id = 'EU-0006-019'
level = 'MUST'
polarity = 'forbidden'
statement = 'A result of one render profile MUST NOT be served for a request of another render profile.'
binds_to = 'system'
rationale = 'The caches of incompatible profiles stay apart.'

[[requirement]]
id = 'EU-0006-020'
level = 'MUST'
polarity = 'required'
statement = 'An export MUST use exactly one render profile.'
binds_to = 'system'
rationale = 'An exported file holds one consistent rendering.'

[[requirement]]
id = 'EU-0006-021'
level = 'MUST'
polarity = 'required'
statement = 'The manifest of a revision MUST pin at most one validated result for each descriptor the revision needs.'
binds_to = 'system'
rationale = 'A revision plays the same audio every time it is played.'
relations = [ { kind = 'depends_on', target = 'EU-0006-011' } ]

[[requirement]]
id = 'EU-0006-022'
level = 'MUST'
polarity = 'required'
statement = "Where no present worker can render a project's pinned render profile, euphony MUST play the project's pinned results."
binds_to = 'system'
rationale = 'A project moved to other computers still plays as it sounded.'

[[requirement]]
id = 'EU-0006-023'
level = 'MUST'
polarity = 'required'
statement = 'Where a project needs a new render profile, euphony MUST show the musician that it does.'
binds_to = 'system'
rationale = 'The musician knows before a render changes how the project sounds.'

[[requirement]]
id = 'EU-0006-024'
level = 'MUST'
polarity = 'required'
statement = "A result MUST be accepted only from a worker that is one of the owner's paired computers."
binds_to = 'system'
rationale = 'An impostor computer never places audio in the project.'

[[requirement]]
id = 'EU-0006-025'
level = 'MUST'
polarity = 'required'
statement = 'A result MUST be accepted only once its descriptor, format, length and digest pass their checks.'
binds_to = 'system'
rationale = 'A corrupt or stale result never enters the cache.'
