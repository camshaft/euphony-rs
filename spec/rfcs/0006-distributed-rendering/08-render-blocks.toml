[section]
anchor = 'render-blocks'
title = 'Render blocks'
problem = """\
  A node that reads an input without a bound never finishes its block where the input holds one \
  value, such as a constant, so the render never ends, and a node that reads more or fewer samples \
  than its inputs hold for the block shifts the audio it writes out of time."""
motivation = """\
  One block length for every render, and a bound on what each node takes from each input in a \
  block, let every render finish and keep each node's output in time with its inputs."""
prose = """
A render processes the project graph in render blocks: in each block, each node takes its inputs
for that block and writes that many samples of its output. A sink is the node that writes a
render's result, and the rules of this section hold for sinks as for every other node. An input of
a node is another node's output or a value, such as a constant, which holds as many samples as a
node asks of it. Every render holds the same block length, on a worker and in the live render
island of RFC 0005 alike, and a render whose length isn't a whole number of blocks ends with a
shorter block."""

[[requirement]]
id = 'EU-0006-098'
level = 'MUST'
polarity = 'required'
statement = 'A render block other than the last block of a render MUST hold 256 samples of each node output.'
binds_to = 'system'
rationale = 'Every node and every input agree on how many samples one block holds.'

[[requirement]]
id = 'EU-0006-099'
level = 'MUST'
polarity = 'required'
statement = 'The last block of a render MUST hold the samples that remain of the render.'
binds_to = 'system'
rationale = 'A render ends at its length and not at the next whole block.'

[[requirement]]
id = 'EU-0006-100'
level = 'MUST'
polarity = 'required'
statement = 'In each render block, each node, each sink among them, MUST take at most as many samples from each of its inputs as the block holds, whatever the input holds.'
binds_to = 'system'
rationale = 'An input that holds a constant value never keeps a node or a sink from finishing its block.'
