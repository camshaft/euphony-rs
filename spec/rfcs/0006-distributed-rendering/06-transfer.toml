[section]
anchor = 'transfer'
title = 'Resumable transfer'
problem = """\
  Render inputs and results that move by a path of their own skip the checks every other stored \
  item passes, a result shown before it is checked can be played as corrupt audio, a bulk transfer \
  can hold up the preparation a person is waiting for, and a computer that answers any request for \
  a chunk exposes the owner's project audio to whoever asks."""
motivation = """\
  Moving every input and result through the one content store resumes and checks render work as \
  any stored item is resumed and checked. Showing a result only once it is complete and checked \
  keeps playback on sound audio, running each transfer at the priority level of the work it serves \
  keeps interactive preparation ahead of speculative preparation, and sending chunks only to the \
  owner's paired computers keeps the owner's audio on the owner's trusted computers."""
prose = """
Every render input and every result moves between computers as an item of the content store, in
chunks, as RFC 0008 states: the chunk list of each item, the fetch of only the chunks a receiver
lacks after a disconnect, the check of each chunk before it counts as present, and connections that
accept only the owner's paired computers and are authenticated and encrypted. The transfer runs
apart from the job queue, and the owner's device discovery service advertises and configures it
without carrying its traffic. A result is written apart from the results the cache shows, checked,
and only then shown."""

[[requirement]]
id = 'EU-0006-060'
level = 'MUST'
polarity = 'required'
statement = 'Every render input and every result MUST move between computers as an item of the content store.'
binds_to = 'system'
rationale = 'Render work moves and is checked as any other stored content is.'

[[requirement]]
id = 'EU-0006-065'
level = 'MUST'
polarity = 'required'
statement = 'A result MUST become visible in the render cache only once it is complete and checked.'
binds_to = 'system'
rationale = 'A half-written result never counts as cached.'

[[requirement]]
id = 'EU-0006-066'
level = 'MUST'
polarity = 'required'
statement = 'A transfer MUST run at the priority level of the work it serves.'
binds_to = 'system'
rationale = 'The chunks of interactive preparation come ahead of the chunks of speculative preparation.'
