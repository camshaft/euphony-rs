[section]
anchor = 'transfer'
title = 'Resumable transfer'
problem = """\
  A dropped connection that restarts a large transfer from the beginning wastes the link, and a \
  receiver that counts a partly written or unchecked piece as present plays corrupt audio after a \
  crash."""
motivation = """\
  Moving every input and result as immutable pieces named by their digests lets a receiver fetch \
  only what it lacks after a disconnect, check each piece before it counts, and survive a crash \
  without trusting a partial write."""
prose = """
Every render input and every result moves between computers as an item of the content store, in
chunks, as RFC 0008 states: the chunk list of each item, the fetch of only the chunks a receiver
lacks after a disconnect, and the check of each chunk before it counts as present. The transfer runs
apart from the job queue, and the owner's device discovery service advertises and configures it
without carrying its traffic. A result is written apart from the results the cache shows, checked,
and only then shown."""

[[requirement]]
id = 'EU-0006-060'
level = 'MUST'
polarity = 'required'
statement = 'Every render input and every result MUST move between computers as an item of the content store.'
binds_to = 'system'
rationale = 'Render work moves and is checked as any other stored content is.'

[[requirement]]
id = 'EU-0006-065'
level = 'MUST'
polarity = 'required'
statement = 'A result MUST become visible in the render cache only once it is complete and checked.'
binds_to = 'system'
rationale = 'A half-written result never counts as cached.'

[[requirement]]
id = 'EU-0006-066'
level = 'MUST'
polarity = 'required'
statement = 'A transfer MUST run at the priority level of the work it serves.'
binds_to = 'system'
rationale = 'The chunks of interactive preparation come ahead of the chunks of speculative preparation.'

[[requirement]]
id = 'EU-0006-090'
level = 'MUST'
polarity = 'forbidden'
statement = "A computer MUST NOT send a chunk of a render input or a result to a computer that isn't one of the owner's paired computers."
binds_to = 'system'
rationale = "The owner's project audio and inputs reach only the owner's trusted computers."
