[section]
anchor = 'calibration'
title = 'Calibration and test signals'
problem = "A measurement of gear through an interface mixes the gear with the delay, response and noise of the interface, holds only at the level it was made at, and misses behavior that its test signals don't exercise."
motivation = "Calibration that separates the interface from the gear, a test signal set that exercises linear, nonlinear, dynamic and random behavior, repeated passes, and sealed final material let a model describe the gear alone and let its closeness be measured."
prose = """
Calibration comes before measurement. A direct cable from an output to an input measures the round
trip delay, frequency response and noise of the interface. A measurement through the gear then
reads the delay of the gear as the difference, to a fraction of a sample, and checks its polarity.
The delay of digital gear is part of its model; the delay of the interface isn't. A tone at a
known digital level, read on the meter of the gear or on a voltmeter, maps digital full scale to
the operating level of the gear, and the rig rises to the highest level the musician sets in steps
from a low level. A reference segment plays at the start and at the end of a capture, and a
difference between them larger than the spread among repeated passes shows that the gear drifted.
The test signal set holds sine sweeps and noise bursts at several levels, transients, level steps
and tone bursts of several sizes and lengths, silence, a long steady tone at 3150 Hz and a pulse
train for pitch modulation, and the musician's own recordings of the material the model will
process. The set plays in K repeated passes, K at least 2, each after the same preroll. Each kind
of signal is split into a training partition, a validation partition for comparing candidates, and
a final partition with its listening clips, which stays sealed until the musician freezes a
candidate. How much capture a model needs is measured, not fixed."""

[[requirement]]
id = 'EU-0010-033'
level = 'MUST'
polarity = 'required'
statement = "Calibration MUST measure the round trip delay, the frequency response and the noise of the audio interface on its own, before a measurement of the gear."
binds_to = 'system'
rationale = "The interface is measured so that it can be left out of the model."

[[requirement]]
id = 'EU-0010-034'
level = 'MUST'
polarity = 'required'
statement = "A model MUST describe the gear without the delay, response or noise of the audio interface."
binds_to = 'system'
rationale = "A model plays the same through any interface."
relations = [ { kind = 'depends_on', target = 'EU-0010-033' } ]

[[requirement]]
id = 'EU-0010-035'
level = 'MUST'
polarity = 'required'
statement = "Calibration MUST measure the delay of the gear to a fraction of a sample."
binds_to = 'system'
rationale = "A model and a blend line up with the hardware exactly."

[[requirement]]
id = 'EU-0010-036'
level = 'MUST'
polarity = 'required'
statement = "Calibration MUST detect an inverted polarity of the gear."
binds_to = 'system'
rationale = "A model never cancels the dry signal it is blended with."

[[requirement]]
id = 'EU-0010-037'
level = 'MUST'
polarity = 'required'
statement = "Calibration MUST map digital full scale to the operating level of the gear."
binds_to = 'system'
rationale = "A model knows the levels at which it reproduces the gear."

[[requirement]]
id = 'EU-0010-038'
level = 'MUST'
polarity = 'required'
statement = "The capture rig MUST rise to the highest level the musician sets in steps from a low level."
binds_to = 'system'
rationale = "A wrong calibration shows at a level that can't harm the gear."

[[requirement]]
id = 'EU-0010-039'
level = 'MUST'
polarity = 'required'
statement = "A capture of gear with a digital clock of its own MUST correct for the measured drift between that clock and the clock of the audio interface."
binds_to = 'system'
rationale = "Clock drift is never mistaken for behavior of the gear."

[[requirement]]
id = 'EU-0010-040'
level = 'MUST'
polarity = 'required'
statement = "A capture MUST compare a reference segment played at its start with one played at its end."
binds_to = 'system'
rationale = "Drift during the capture is detected."

[[requirement]]
id = 'EU-0010-041'
level = 'MUST'
polarity = 'required'
statement = "Where the reference segments of a capture differ by more than the spread among its repeated passes, the capture rig MUST ask the musician to let the gear warm up and capture again."
binds_to = 'system'
rationale = "A model is fitted to gear in one steady state."
relations = [ { kind = 'depends_on', target = 'EU-0010-040' } ]

[[requirement]]
id = 'EU-0010-042'
level = 'MUST'
polarity = 'required'
statement = "Each test signal MUST have a stored seed and version, so that a capture can be repeated."
binds_to = 'system'
rationale = "Two captures of one plan play the same signals."

[[requirement]]
id = 'EU-0010-043'
level = 'MUST'
polarity = 'required'
statement = "The test signal set MUST hold sine sweeps and noise bursts at several levels, transients, level steps and tone bursts of several sizes and lengths, silence, a steady tone, a pulse train and the musician's own program material."
binds_to = 'system'
rationale = "The set exercises the linear, nonlinear, dynamic, random and program-dependent behavior of the gear."

[[requirement]]
id = 'EU-0010-044'
level = 'MUST'
polarity = 'required'
statement = "A capture MUST play each test segment in at least two repeated passes, each after the same preroll."
binds_to = 'system'
rationale = "Repeated passes separate the average behavior of the gear from its random part."

[[requirement]]
id = 'EU-0010-045'
level = 'MUST'
polarity = 'required'
statement = "A capture MUST split each kind of test signal into a training partition, a validation partition and a final partition."
binds_to = 'system'
rationale = "Fitting, selection and the final test each read material of their own."

[[requirement]]
id = 'EU-0010-046'
level = 'MUST'
polarity = 'forbidden'
statement = "Fitting, candidate selection and development listening MUST NOT read the final partition."
binds_to = 'system'
rationale = "The final test measures a model on material that never shaped it."
relations = [ { kind = 'depends_on', target = 'EU-0010-045' } ]

[[requirement]]
id = 'EU-0010-047'
level = 'MUST'
polarity = 'required'
statement = "A capture MUST stop once its error lies within the tolerance the musician declares and its random-part comparisons pass, once more capture no longer improves its estimates beyond their intervals, or on the musician's stop."
binds_to = 'system'
rationale = "How much capture a model takes is decided by the measurements, not by a fixed amount."

[[requirement]]
id = 'EU-0010-048'
level = 'MUST'
polarity = 'required'
statement = "A model MUST store the calibrated level of its capture."
binds_to = 'system'
rationale = "A model plays at the level the gear was measured at."
relations = [ { kind = 'depends_on', target = 'EU-0010-037' } ]

[[requirement]]
id = 'EU-0010-049'
level = 'MUST'
polarity = 'required'
statement = "A model MUST report when its input goes outside the levels its capture covered."
binds_to = 'system'
rationale = "The musician knows when a model plays beyond its evidence."
relations = [ { kind = 'depends_on', target = 'EU-0010-048' } ]

[[requirement]]
id = 'EU-0010-050'
level = 'MUST'
polarity = 'required'
statement = "A model MUST keep the description of the control settings of the gear that the musician provides with its capture."
binds_to = 'system'
rationale = "The musician can set the hardware again to the settings the model copies."
