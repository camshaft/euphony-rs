[section]
anchor = 'layouts'
title = 'Layouts and panels'
problem = "Each person wants their own arrangement of controls on each device, but a layout that selects its controls by their display labels, runs code, or is restored without checks can drive the wrong parameter, carry an attack, or bring back controls that no longer exist."
motivation = "Typed, versioned layouts saved per project, surface and user, which select targets by stable identity and pass the same checks on every apply and restore, let each surface keep its own view of one session safely."
prose = '''
A layout arranges panels over the session's existing controls. The panels are the mixer, transport,
the controls of one built-in processor, smart controls, track parameters and the modulation patch
view, whose values RFC 0012 states. A smart control is a declarative macro that maps one input to
parameters it identifies explicitly, each with its unit, curve and legal range. A layout holds view
kinds, the stable identities of its targets, banks, target ranges and mappings; display labels,
screen position and the current selection are presentation, not part of the layout. Each layout is
saved with the project's session configuration, by project, stable surface identity and user, and
a device can keep a default that seeds its layouts in new projects. The session host validates and
saves every layout change, and the desktop interface, the browser companion, every surface and the
assistant interface read the same records. A tablet can hold a mixer, a phone transport and another
screen a processor or a patch view, each independent of the desktop's selection. The browser
companion sends the same commands as every surface and stays narrower than the desktop interface.
A panel is offered on a surface where a conformance record shows that it passes its capability and
accessibility tests for that surface's profile, its renderer and the running build. Applying a layout
returns the committed revision, or denied, stale revision, unknown target, incompatible capability,
invalid mapping or unverified panel. Attaching returns the session and control generations, an
authorized snapshot and a subscription cursor, or a refusal of the enrollment or the protocol.'''

[[requirement]]
id = 'EU-0017-041'
level = 'MUST'
polarity = 'required'
statement = "The system MUST save each surface layout with the project's session configuration, by project, surface identity and user."
binds_to = 'system'
rationale = "Each person gets each device's arrangement back in each project."

[[requirement]]
id = 'EU-0017-042'
level = 'MAY'
polarity = 'required'
statement = "A device MAY keep a default layout that seeds its layouts in new projects."
binds_to = 'system'
rationale = "A person doesn't arrange the same device again for every project."

[[requirement]]
id = 'EU-0017-043'
level = 'MUST'
polarity = 'required'
statement = "The system MUST store surface layouts, attachments and device bindings encrypted at rest with the project's other data."
binds_to = 'system'
rationale = "A device's records are as private as the project they belong to."

[[requirement]]
id = 'EU-0017-044'
level = 'MUST'
polarity = 'forbidden'
statement = "A store that cannot encrypt surface records MUST NOT persist them."
binds_to = 'system'
rationale = "Surface records are never kept unencrypted."

[[requirement]]
id = 'EU-0017-045'
level = 'MUST'
polarity = 'required'
statement = "A layout MUST select each of its targets by the target's stable identity."
binds_to = 'system'
rationale = "Renaming a track or a parameter never moves a control to another target."

[[requirement]]
id = 'EU-0017-046'
level = 'MUST'
polarity = 'forbidden'
statement = "A display label MUST NOT select a layout's target."
binds_to = 'system'
rationale = "Two targets with the same label can never be confused."

[[requirement]]
id = 'EU-0017-047'
level = 'MUST'
polarity = 'forbidden'
statement = "A layout MUST NOT hold executable code."
binds_to = 'system'
rationale = "A shared or imported layout can't run anything on a device or the host."

[[requirement]]
id = 'EU-0017-048'
level = 'MUST'
polarity = 'forbidden'
statement = "Importing a layout MUST NOT import credentials, pairings, links, tools or programs."
binds_to = 'system'
rationale = "A layout from someone else never grants access or adds behavior."

[[requirement]]
id = 'EU-0017-049'
level = 'MUST'
polarity = 'required'
statement = "A layout target that no longer exists MUST be shown as unresolved."
binds_to = 'system'
rationale = "A deleted target never silently falls through to another one."

[[requirement]]
id = 'EU-0017-050'
level = 'MUST'
polarity = 'required'
statement = "The system MUST restore a saved layout only after it validates the layout's targets, its schema and the surface's pairing."
binds_to = 'system'
rationale = "A reconnected surface never brings back controls it may no longer use."

[[requirement]]
id = 'EU-0017-051'
level = 'MUST'
polarity = 'required'
statement = "The system MUST offer mixer, transport, built-in processor, smart control, track parameter and modulation patch panels."
binds_to = 'system'
rationale = "A surface reaches every control a musician plays from a surface."

[[requirement]]
id = 'EU-0017-052'
level = 'MUST'
polarity = 'required'
statement = "A smart control MUST map its input only to parameters it identifies explicitly, each with its unit, curve and legal range."
binds_to = 'system'
rationale = "A macro moves exactly the parameters its writer chose, within their ranges."

[[requirement]]
id = 'EU-0017-053'
level = 'MUST'
polarity = 'required'
statement = "A surface MUST show a smart control's whole target set before the control is committed."
binds_to = 'system'
rationale = "A person sees every parameter a macro will move before it moves them."

[[requirement]]
id = 'EU-0017-054'
level = 'MUST'
polarity = 'required'
statement = "A smart control gesture MUST commit to its whole target set atomically."
binds_to = 'system'
rationale = "A macro never leaves some of its targets moved and others not."

[[requirement]]
id = 'EU-0017-055'
level = 'MUST'
polarity = 'required'
statement = "A smart control gesture with any invalid target MUST be denied as a whole."
binds_to = 'system'
rationale = "One bad target never lets the rest of a macro apply."

[[requirement]]
id = 'EU-0017-056'
level = 'MUST'
polarity = 'forbidden'
statement = "Editing a sound parameter from a surface MUST NOT write its modulated value into its base value."
binds_to = 'system'
rationale = "Modulation stays a contribution over the value a person set."

[[requirement]]
id = 'EU-0017-057'
level = 'MUST'
polarity = 'required'
statement = "A surface MUST show a parameter's base value, its modulation contributions and its effective value separately."
binds_to = 'system'
rationale = "A person sees what they set apart from what modulation adds."

[[requirement]]
id = 'EU-0017-058'
level = 'MUST'
polarity = 'forbidden'
statement = "A surface MUST NOT follow another surface's selected track unless its layout is configured to follow it."
binds_to = 'system'
rationale = "Each surface keeps its own view while others change their selection."

[[requirement]]
id = 'EU-0017-059'
level = 'MUST'
polarity = 'forbidden'
statement = "The browser companion MUST NOT offer offline editing or render on its own."
binds_to = 'system'
rationale = "The companion stays a view of the session, never a second editor."

[[requirement]]
id = 'EU-0017-060'
level = 'MUST'
polarity = 'required'
statement = "Each touch panel MUST offer keyboard, screen-reader and single-pointer alternatives."
binds_to = 'system'
rationale = "A person who doesn't use touch reaches every control a panel offers."

[[requirement]]
id = 'EU-0017-061'
level = 'MUST'
polarity = 'forbidden'
statement = "Changing a bank or the orientation of a surface MUST NOT retarget an active gesture."
binds_to = 'system'
rationale = "A rotated or rebanked surface never moves a different control mid-drag."

[[requirement]]
id = 'EU-0017-062'
level = 'MUST'
polarity = 'required'
statement = "The system MUST apply a layout only where each of its panels has a passing capability and accessibility conformance record for the surface's profile, its renderer and the running build."
binds_to = 'system'
rationale = "A panel reaches a surface only where it has been shown to work there."

[[requirement]]
id = 'EU-0017-063'
level = 'MUST'
polarity = 'required'
statement = "Restoring a saved layout and activating a panel MUST pass the same conformance check as applying a layout."
binds_to = 'system'
rationale = "No path brings an unverified panel onto a surface."

[[requirement]]
id = 'EU-0017-064'
level = 'MUST'
polarity = 'forbidden'
statement = "Previewing a layout MUST NOT change any state."
binds_to = 'system'
rationale = "A person tries a layout out without committing it."

[[requirement]]
id = 'EU-0017-065'
level = 'MUST'
polarity = 'required'
statement = "Applying a layout MUST be refused where its expected layout revision is not the current one."
binds_to = 'system'
rationale = "Two people arranging one surface never overwrite each other unseen."

[[requirement]]
id = 'EU-0017-066'
level = 'MUST'
polarity = 'required'
statement = "Attaching a surface MUST return the session and control generations, an authorized snapshot and a subscription cursor, or the reason it was refused."
binds_to = 'system'
rationale = "A surface starts from the session's current state or knows why it can't."

[[requirement]]
id = 'EU-0017-067'
level = 'MUST'
polarity = 'required'
statement = "A surface's snapshot and the changes that follow it MUST share one revision boundary."
binds_to = 'system'
rationale = "A surface neither misses nor applies twice a change made as it attached."

[[requirement]]
id = 'EU-0017-068'
level = 'MAY'
polarity = 'required'
statement = "An assistant MAY arrange a surface's layout."
binds_to = 'system'
rationale = "A person asks an assistant to set up their devices."

[[requirement]]
id = 'EU-0017-154'
level = 'MUST'
polarity = 'required'
statement = "The desktop interface, the browser companion, every surface and the assistant interface MUST share one set of layout records."
binds_to = 'system'
rationale = "A change made through any of them is the same change for all of them."

[[requirement]]
id = 'EU-0017-155'
level = 'MUST'
polarity = 'required'
statement = "Applying a layout MUST return the committed revision or one of these refusals: denied, stale revision, unknown target, incompatible capability, invalid mapping or unverified panel."
binds_to = 'system'
rationale = "A surface knows whether its layout took effect and, where it didn't, why."

[[requirement]]
id = 'EU-0017-156'
level = 'MUST'
polarity = 'forbidden'
statement = "A shared layout template MUST NOT carry or grant a pairing."
binds_to = 'system'
rationale = "Sharing an arrangement of controls never shares access to a session."
