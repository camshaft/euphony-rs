[section]
anchor = 'profiles'
title = 'Supported surface profiles'
problem = "Controllers and devices differ widely, and a release that claims a surface works without physical evidence for it, or lists profiles its evidence doesn't hold, sends a musician onto a surface that fails mid-take."
motivation = "Stating support per verified profile, deriving the supported list from conformance records of physical runs, and keeping every requested surface category covered lets a musician trust each surface a release offers."
prose = '''
A surface profile is a kind of device and host, such as a model of hardware controller with the
computer its adapter runs on. A hardware adapter is a helper on an enrolled computer that the
discovery service finds and configures, and translates a controller's own protocol into the surface
commands of this RFC; a network instrument controller keeps the stable device identity that RFC
0016 states. A conformance publisher, set in the project's configuration, records each profile's
identity, the panel, the renderer and the build, the test evidence and the verdict. The project's
configuration also sets the surface categories a release covers: phone, tablet, desktop window or
touch monitor, browser companion and hardware controller. Universal controller compatibility is not
assumed, and later versions add profiles.'''

[[requirement]]
id = 'EU-0017-142'
level = 'MUST'
polarity = 'required'
statement = "A hardware adapter MUST translate its controller's protocol into the surface commands of this RFC."
binds_to = 'system'
rationale = "Every controller acts through the same contract as every other surface."

[[requirement]]
id = 'EU-0017-143'
level = 'MUST'
polarity = 'required'
statement = "Support for hardware controllers MUST be stated for each verified profile."
binds_to = 'system'
rationale = "A musician knows exactly which devices work."

[[requirement]]
id = 'EU-0017-144'
level = 'MUST'
polarity = 'required'
statement = "A surface profile without a passing physical conformance record for the running build MUST be unavailable."
binds_to = 'system'
rationale = "Only shown-to-work surfaces are offered."

[[requirement]]
id = 'EU-0017-145'
level = 'MUST'
polarity = 'forbidden'
statement = "Simulated evidence MUST NOT stand in for a physical conformance record."
binds_to = 'system'
rationale = "A simulator can't show how a real device and network behave."

[[requirement]]
id = 'EU-0017-146'
level = 'MUST'
polarity = 'required'
statement = "The list of supported profiles MUST be derived from the conformance records."
binds_to = 'system'
rationale = "The advertised list never drifts from the evidence."

[[requirement]]
id = 'EU-0017-147'
level = 'MUST'
polarity = 'forbidden'
statement = "A release MUST NOT advertise a profile list that differs from the conformance records."
binds_to = 'system'
rationale = "Every profile a release claims has passing evidence."

[[requirement]]
id = 'EU-0017-148'
level = 'MUST'
polarity = 'required'
statement = "A release MUST hold passing evidence for each surface category the project's configuration requires."
binds_to = 'system'
rationale = "A release covers every kind of surface it is meant to, not the phone alone."

[[requirement]]
id = 'EU-0017-149'
level = 'MUST'
polarity = 'forbidden'
statement = "A conformance record MUST NOT authorize pairing or control."
binds_to = 'system'
rationale = "Evidence that a device works never grants it access."

[[requirement]]
id = 'EU-0017-150'
level = 'MUST'
polarity = 'required'
statement = "The surface categories, the mobile platforms of the phone controller and the conformance publisher MUST be set in the project's configuration."
binds_to = 'system'
rationale = "A team changes what a release covers without changing code."

[[requirement]]
id = 'EU-0017-166'
level = 'MAY'
polarity = 'required'
statement = "A hardware controller that only displays a surface MAY present it without emulating a touch screen."
binds_to = 'system'
rationale = "A display-only device shows controls in the form its hardware has."
