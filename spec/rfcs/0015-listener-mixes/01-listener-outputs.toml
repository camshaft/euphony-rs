[section]
anchor = 'listener-outputs'
title = 'Listener outputs and listener mixes'
problem = """\
  During a recording each player wants their own headphone mix, such as more click and bass for a \
  drummer and more drums for a guitarist, and a change one listener makes can reach another listener, \
  the main mix or a take unless each listening output is a sink of its own."""
motivation = """\
  A sink for each listening output, with its own listener, gain limit and mix revision, lets each \
  listener shape what they hear within the owner's limit while every other output stays as it was."""
prose = """
A sink is one listening output of a session: a device or a stream that plays audio to one listener,
such as headphones at a player's seat, a pair of speakers or a headphone station. Each sink names its
listener and states its device and stream identity, its clock domain, its channel layout and its
latency. The owner of a session assigns the controller of each sink and sets its gain limit. A sink
mix is the mix one sink plays: it can take any track of the session, and its gains, pans and
processing are its own. The main mix is the mix of the session itself. Each sink mix has a revision
of its own, so a change to one sink mix is a new revision of that mix alone. Every client that
changes a mix, the desktop interface, a phone or an assistant, sends the same commands to the
session host, which applies the same rules to each of them."""

[[requirement]]
id = 'EU-0015-001'
level = 'MUST'
polarity = 'required'
statement = 'Each listening output of a session MUST be a sink that states its device and stream identity, its listener, its clock domain, its channel layout and its latency.'
binds_to = 'system'
rationale = 'The host and every client read the properties of each output from one record.'

[[requirement]]
id = 'EU-0015-002'
level = 'MUST'
polarity = 'forbidden'
statement = 'The host MUST NOT let anyone other than the owner assign the controller of a sink.'
binds_to = 'system'
rationale = 'The owner decides who controls each listening output.'

[[requirement]]
id = 'EU-0015-003'
level = 'MUST'
polarity = 'forbidden'
statement = 'The host MUST NOT let anyone other than the owner set the gain limit of a sink.'
binds_to = 'system'
rationale = 'The owner decides how loud each listening output can get.'

[[requirement]]
id = 'EU-0015-004'
level = 'MUST'
polarity = 'required'
statement = 'A listener MUST be able to adjust the mix of their own sink.'
binds_to = 'system'
rationale = 'Each player shapes their own headphone mix without asking the engineer.'

[[requirement]]
id = 'EU-0015-005'
level = 'MAY'
polarity = 'required'
statement = "A listener's sink mix MAY include any track of the session."
binds_to = 'system'
rationale = 'A player listens to whatever part of the session helps them play.'

[[requirement]]
id = 'EU-0015-006'
level = 'MUST'
polarity = 'forbidden'
statement = "The host MUST NOT accept a command from a listener who isn't the owner that changes another listener's sink mix."
binds_to = 'system'
rationale = 'One listener never changes what reaches another listener.'

[[requirement]]
id = 'EU-0015-007'
level = 'MUST'
polarity = 'forbidden'
statement = "The host MUST NOT accept a command from a listener who isn't the owner that changes the main mix."
binds_to = 'system'
rationale = 'A listener shapes their own mix and never the mix of the session.'

[[requirement]]
id = 'EU-0015-008'
level = 'MUST'
polarity = 'required'
statement = 'The host MUST apply the same rules to a mix command whether it comes from the desktop interface, a phone or an assistant.'
binds_to = 'system'
rationale = 'No client reaches a mix that another client could not.'

[[requirement]]
id = 'EU-0015-009'
level = 'MUST'
polarity = 'required'
statement = 'Each sink MUST have a mix revision of its own.'
binds_to = 'system'
rationale = 'A change to one sink mix is a revision of that mix alone.'

[[requirement]]
id = 'EU-0015-010'
level = 'MUST'
polarity = 'required'
statement = 'Every gain of a sink mix MUST stay within the gain limit the owner set for that sink.'
binds_to = 'system'
rationale = 'No listener raises their output past the level the owner allows.'

[[requirement]]
id = 'EU-0015-011'
level = 'MUST'
polarity = 'forbidden'
statement = 'A change of one sink mix MUST NOT change the output of any other sink.'
binds_to = 'system'
rationale = 'Each listener gets only the changes made to their own mix.'

[[requirement]]
id = 'EU-0015-012'
level = 'MUST'
polarity = 'forbidden'
statement = 'A change of one sink mix MUST NOT change the main mix.'
binds_to = 'system'
rationale = 'The engineer mixes the session while players adjust their own mixes.'

[[requirement]]
id = 'EU-0015-013'
level = 'MUST'
polarity = 'forbidden'
statement = 'A change of one sink mix MUST NOT change a recording in progress.'
binds_to = 'system'
rationale = 'A take is never affected by what a player listens to.'

[[requirement]]
id = 'EU-0015-014'
level = 'MUST'
polarity = 'forbidden'
statement = "A change of one sink mix MUST NOT cause a new rendering of any output that doesn't depend on that sink mix."
binds_to = 'system'
rationale = "One listener's adjustment costs only the work that adjustment needs."
