[section]
anchor = 'reuse'
title = 'Reuse, invalidation and staleness'
problem = """\
  An analysis that runs again for every view wastes the musician's machines, a result kept after \
  its input or its method changed reports something no longer true, and a new method that rewrites \
  old results changes how a project sounds without anyone asking."""
motivation = """\
  Identifying each request by every input that can change its answer lets the system reuse a \
  result exactly while it holds, mark it stale as soon as it doesn't, and keep the results of older \
  methods beside those of newer ones."""
prose = """
The identity of a request is everything that can change its answer: the source asset or the
description of the render that made it, the decoded sample format and channel map, the interval,
the method and its version, its parameters, the version of each decoding and preprocessing step,
the model and its digest, the seed where the method uses one, the execution profile it runs under,
and its context. Each method declares the context it needs: a whole-song estimate of key or
structure depends on the whole song, not only the passage shown, and context can include selected
stems, preceding state and the version of a beat grid. A method can declare that its result over a
window depends on that window alone, and conformance tests show that the declaration holds; the
result of such a window can then be reused inside a larger request. A change of hardware or of
model that can change a method's answers is a new execution profile. A result whose dependencies
changed is stale: it stays visible as stale until someone asks for it to be computed again. An
existing project keeps the results it accepted, and the methods that made them, so that a newer
method doesn't change how it sounds."""

[[requirement]]
id = 'EU-0020-032'
level = 'MUST'
polarity = 'required'
statement = 'The identity of a request MUST include every input that can change its result.'
binds_to = 'system'
rationale = 'Two requests with the same identity have the same answer, and any other pair is kept apart.'

[[requirement]]
id = 'EU-0020-033'
level = 'MUST'
polarity = 'required'
statement = 'Each method MUST declare the context its results depend on beyond the analyzed interval.'
binds_to = 'system'
rationale = 'A whole-song estimate is invalidated by a change outside the passage a musician is looking at.'

[[requirement]]
id = 'EU-0020-034'
level = 'MUST'
polarity = 'required'
statement = 'A request whose identity matches an earlier one MUST reuse the validated result of that request instead of running again.'
binds_to = 'system'
rationale = 'The same question is answered once.'
relations = [ { kind = 'depends_on', target = 'EU-0020-032' } ]

[[requirement]]
id = 'EU-0020-035'
level = 'MUST'
polarity = 'required'
statement = "A change to any input in a request's identity MUST invalidate each result that depends on that input."
binds_to = 'system'
rationale = 'A result never describes audio or context that no longer exists.'
relations = [ { kind = 'depends_on', target = 'EU-0020-032' } ]

[[requirement]]
id = 'EU-0020-036'
level = 'MUST'
polarity = 'forbidden'
statement = 'The system MUST NOT reuse the result of a window inside a larger request unless its method declares that its results over a window depend on that window alone.'
binds_to = 'system'
rationale = 'A result that depends on wider context is never stitched into a request it does not describe.'

[[requirement]]
id = 'EU-0020-037'
level = 'MUST'
polarity = 'required'
statement = "A change of hardware or of model that can change a method's answers MUST be treated as a new execution profile."
binds_to = 'system'
rationale = 'A result computed on one profile is never reused as if another profile had computed it.'

[[requirement]]
id = 'EU-0020-038'
level = 'MUST'
polarity = 'required'
statement = 'For a method whose runs can differ, the system MUST keep the exact result it produced, identified by its digest.'
binds_to = 'system'
rationale = 'A result that a rerun would not reproduce stays the one the musician saw and accepted.'

[[requirement]]
id = 'EU-0020-039'
level = 'MUST'
polarity = 'required'
statement = 'A stale result MUST remain inspectable and marked as stale.'
binds_to = 'system'
rationale = 'A musician still sees what was estimated, and knows that it no longer holds.'

[[requirement]]
id = 'EU-0020-040'
level = 'MUST'
polarity = 'forbidden'
statement = 'The system MUST NOT recompute a stale result unless someone asks for it to be recomputed.'
binds_to = 'system'
rationale = 'A change of a project never starts unrequested work, and a stale result does not change under a reader.'

[[requirement]]
id = 'EU-0020-041'
level = 'MUST'
polarity = 'forbidden'
statement = 'A new method or method version MUST NOT rewrite an existing result, correction or accepted interpretation.'
binds_to = 'system'
rationale = 'A new method adds its result beside the old one, and the musician chooses between them.'

[[requirement]]
id = 'EU-0020-042'
level = 'MUST'
polarity = 'required'
statement = 'Each accepted result and its dependencies MUST be retained for as long as the project that accepted the result is retained.'
binds_to = 'system'
rationale = 'A project never loses an interpretation its music was built on.'

[[requirement]]
id = 'EU-0020-043'
level = 'MUST'
polarity = 'forbidden'
statement = 'An upgrade of a method MUST NOT change the sound of a project that uses the results of an earlier version.'
binds_to = 'system'
rationale = 'An existing project sounds the same after the system improves its analysis.'
