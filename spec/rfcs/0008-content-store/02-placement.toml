[section]
anchor = 'placement'
title = 'Tiers, placement and repair'
problem = """\
  A computer that fails can take the only copy of material that can't be recreated, archived \
  projects fill the disks of the computers a musician works on, and no one knows which items have \
  fewer copies than they need."""
motivation = """\
  The owner's own rules, applied the same way by each of the owner's computers, keep the number of \
  verified copies the owner sets on separate computers, keep long-term material on computers with \
  large disks, and repair a lost copy as soon as the loss is known."""
prose = """
Each of the owner's paired computers declares, in configuration the owner signs, whether it holds a
working tier, a storage tier or both, and the storage it offers each. A working computer holds what
its sessions use; a storage computer, called a holder, holds long-term and archived content, and a
computer can be a holder and a render worker at once. The owner's placement policy is a signed,
versioned list of rules. A rule selects items by kind, by whether the item can be recreated, by the
projects that use it and whether they are archived, by when a session last used it, and by size,
and places them as a number of verified copies on separate computers, the tiers that hold them, and
whether a working computer keeps a copy. The policy starts with these values, which the owner
changes: two verified copies on separate computers for source originals and recordings, one of them
on a storage tier; no copy beyond the render cache for a rendered result whose inputs are retained;
and a move to storage when the owner archives a project, with the rules on last use and size off.
Each of the owner's computers plans from the same policy and the latest availability reports, on
events, and plans the same actions: copy an item's missing chunks to a holder, verify a holder's
copy, or release a working copy. A holder that has stored and verified an item signs a receipt that
names the item, its chunk list, the holder and the storage volume. Copies on one storage
volume, or on volumes of one network storage server, count as one copy. A copy is released only through
reservations that other holders record for that release: each reserving holder keeps its copy, a holder
releasing its own copy isn't reserved for another release of the same item, and
the release commits only while the policy and the pairing are those it recorded. Each release has
an epoch, so that a release planned by a computer the owner declares lost is settled once and its
late messages change nothing; a release that recovery can't settle keeps its reservations and shows to
the owner as unresolved. A holder verifies a copy by reading each chunk, checking its digest,
decoding it and checking the item's identity. Where the verified copies of an item fall below its
policy, the planner copies it again from the remaining copies; where no verified copy remains, the
item is unavailable and each project shows the regions that can't sound. Holders don't encrypt what
they store: an owner who wants encryption at rest turns on disk encryption on each computer."""

[[requirement]]
id = 'EU-0008-021'
level = 'MUST'
polarity = 'required'
statement = 'The placement policy MUST be a versioned record signed by the owner.'
binds_to = 'system'
rationale = 'Every computer reads the same rules, and no one but the owner sets them.'

[[requirement]]
id = 'EU-0008-022'
level = 'MUST'
polarity = 'required'
statement = 'A change of the placement policy MUST take effect only once the owner approves it.'
binds_to = 'system'
rationale = 'An assistant or another computer proposes a change and the owner decides it.'

[[requirement]]
id = 'EU-0008-023'
level = 'MUST'
polarity = 'required'
statement = 'Each computer of the owner MUST plan placement from the same signed policy and the latest availability reports of the computers of the owner.'
binds_to = 'system'
rationale = 'Two planners plan the same copies and never undo each other.'

[[requirement]]
id = 'EU-0008-024'
level = 'MUST'
polarity = 'required'
statement = 'Placement MUST keep, for each item, the number of verified copies on separate computers that the policy sets for it.'
binds_to = 'system'
rationale = 'An item survives the loss of any computer that the policy allows for.'

[[requirement]]
id = 'EU-0008-025'
level = 'MUST'
polarity = 'required'
statement = 'Placement MUST plan again when a project is archived, opened or closed, a session ends, the policy changes, a holder joins, leaves or reports a storage error or storage pressure, a verification fails, or a computer is unpaired or declared lost.'
binds_to = 'system'
rationale = 'Each change that can move or lose a copy is acted on when it happens.'

[[requirement]]
id = 'EU-0008-026'
level = 'MUST'
polarity = 'forbidden'
statement = 'The placement planner MUST NOT run on a timer.'
binds_to = 'system'
rationale = 'Placement acts on the events that change copies, and not on a schedule.'

[[requirement]]
id = 'EU-0008-027'
level = 'MUST'
polarity = 'required'
statement = 'Two copies on one storage volume, or on volumes of one network storage server, MUST count as one copy.'
binds_to = 'system'
rationale = 'The loss of one disk or one server never takes more copies than were counted.'

[[requirement]]
id = 'EU-0008-028'
level = 'MUST'
polarity = 'required'
statement = 'A holder MUST sign a receipt for each item it has stored and verified.'
binds_to = 'system'
rationale = 'A copy counts only where its holder vouches for it.'

[[requirement]]
id = 'EU-0008-029'
level = 'MUST'
polarity = 'required'
statement = 'A receipt MUST count as stale once its holder restarts, reports a storage error on its volume or is unpaired, until the holder verifies the item again.'
binds_to = 'system'
rationale = 'A receipt stands only for a copy that is known to be intact.'

[[requirement]]
id = 'EU-0008-030'
level = 'MUST'
polarity = 'required'
statement = 'Two holders that report the same storage volume MUST be shown to the owner as a conflict until it is resolved.'
binds_to = 'system'
rationale = 'An aliased volume never counts twice without the owner seeing it.'

[[requirement]]
id = 'EU-0008-031'
level = 'MUST'
polarity = 'required'
statement = 'A copy MUST be released only where other holders on separate computers and independent storage have reserved the item for that release, covering the copies the policy requires.'
binds_to = 'system'
rationale = 'Two releases never each count the copy that the other removes.'

[[requirement]]
id = 'EU-0008-032'
level = 'MUST'
polarity = 'forbidden'
statement = 'A holder that holds a reservation on an item MUST NOT release its own copy of that item.'
binds_to = 'system'
rationale = 'A reserved copy stays until the release it serves is settled.'

[[requirement]]
id = 'EU-0008-033'
level = 'MUST'
polarity = 'required'
statement = 'A release MUST be cancelled where the policy or the pairing of the computers of the owner changes before it commits.'
binds_to = 'system'
rationale = 'A release never commits on rules or computers that no longer hold.'

[[requirement]]
id = 'EU-0008-034'
level = 'MUST'
polarity = 'required'
statement = 'Each release MUST reach exactly one terminal state, committed or cancelled, which never changes afterwards.'
binds_to = 'system'
rationale = 'Every party reads the same outcome of a release.'

[[requirement]]
id = 'EU-0008-035'
level = 'MUST'
polarity = 'required'
statement = 'After a crash, a holder MUST keep its reservations until the terminal state of the release they serve is known.'
binds_to = 'system'
rationale = 'A crash never frees a copy that a release still counts on.'
relations = [ { kind = 'depends_on', target = 'EU-0008-034' } ]

[[requirement]]
id = 'EU-0008-036'
level = 'MUST'
polarity = 'required'
statement = 'Where the computer that planned a release is declared lost, recovery MUST settle the release on the releasing holder before it frees any reservation.'
binds_to = 'system'
rationale = 'The loss of a planner never leaves fewer copies than the policy requires.'

[[requirement]]
id = 'EU-0008-037'
level = 'MUST'
polarity = 'required'
statement = 'Once recovery has settled a release, the releasing holder MUST refuse every later message of that release.'
binds_to = 'system'
rationale = 'A delayed commit from a lost planner changes nothing.'
relations = [ { kind = 'depends_on', target = 'EU-0008-036' } ]

[[requirement]]
id = 'EU-0008-038'
level = 'MUST'
polarity = 'forbidden'
statement = 'A source original or a recording MUST NOT be released from its last working copy before a release of it commits.'
binds_to = 'system'
rationale = 'Material that cannot be recreated always keeps a copy that is counted.'

[[requirement]]
id = 'EU-0008-039'
level = 'MUST'
polarity = 'required'
statement = 'A verification MUST check each chunk of a copy and its decoded content against the identity of the item.'
binds_to = 'system'
rationale = 'A flipped bit, a truncated chunk or a wrong sample is found.'

[[requirement]]
id = 'EU-0008-040'
level = 'MUST'
polarity = 'required'
statement = 'A holder MUST verify a copy when it is written, when the holder starts, when it reports a storage error, when the owner asks, and before a working copy is released on the strength of that copy.'
binds_to = 'system'
rationale = 'A copy is checked at each event that can leave it damaged or that relies on it.'

[[requirement]]
id = 'EU-0008-041'
level = 'MUST'
polarity = 'required'
statement = 'Where the reachable verified copies of an item fall below its policy, placement MUST copy it again from the remaining verified copies.'
binds_to = 'system'
rationale = 'Copies lost with a computer are restored from the others.'

[[requirement]]
id = 'EU-0008-042'
level = 'MUST'
polarity = 'required'
statement = 'The owner MUST be shown each item that has fewer verified copies than its policy sets.'
binds_to = 'system'
rationale = 'The owner knows which material is at risk until the repair completes.'

[[requirement]]
id = 'EU-0008-043'
level = 'MUST'
polarity = 'required'
statement = 'When a holder returns after its copies were repaired, placement MUST release the surplus copies that the policy does not need.'
binds_to = 'system'
rationale = 'A repair never leaves disks filled with copies that the policy does not ask for.'

[[requirement]]
id = 'EU-0008-044'
level = 'MUST'
polarity = 'required'
statement = 'Where no verified copy of an item remains, each project that refers to it MUST show which regions cannot sound.'
binds_to = 'system'
rationale = 'A loss is seen where it matters, and never sounds as silence.'

[[requirement]]
id = 'EU-0008-045'
level = 'MUST'
polarity = 'required'
statement = 'Each step of placement, verification, repair, release and fetch MUST emit a typed event with the item kind, the tier and the bytes.'
binds_to = 'system'
rationale = 'Every movement of content can be observed.'

[[requirement]]
id = 'EU-0008-046'
level = 'MUST'
polarity = 'forbidden'
statement = 'An event of the store MUST NOT hold the file name or the project of an item.'
binds_to = 'system'
rationale = 'What the events record reveals nothing of what the owner works on.'

[[requirement]]
id = 'EU-0008-125'
level = 'MUST'
polarity = 'forbidden'
statement = 'A holder that is releasing its own copy of an item MUST NOT be reserved for another release of the same item.'
binds_to = 'system'
rationale = 'Of two releases that conflict, at most one obtains the reservations it needs.'

[[requirement]]
id = 'EU-0008-138'
level = 'MUST'
polarity = 'required'
statement = 'A release that recovery cannot settle MUST keep its reservations and be shown to the owner as an unresolved release.'
binds_to = 'system'
rationale = 'An unsettled release never frees a copy, and the owner sees it.'
