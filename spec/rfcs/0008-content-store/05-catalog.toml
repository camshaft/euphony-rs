[section]
anchor = 'catalog'
title = 'The catalog'
problem = """\
  A musician's samples, recordings, notes and automation are spread across projects and computers, \
  so they can't find an item, see where it is used, or reuse it without copying it again."""
motivation = """\
  One index of every item, built from the store's typed records, that people and their assistants \
  search by every property and place from by reference, makes the whole library reusable without \
  a second copy or a second record to keep in step."""
prose = """
The catalog indexes every item in the owner's stores, on each of the owner's computers, and is
rebuilt from the typed records of the store and of the projects. An entry holds the item: its
identity, kind, size, length, format and availability, with its copies and tiers. It holds the
item's uses: each project, revision, branch, track and region that refers to it, taken from
committed revisions alone. It holds the item's own metadata, such as the tags, loop and root-note
information, sample rate, bit depth and original file name that the imported file carried, which
stay on the owner's computers. It holds the information analysis extracted from the item, such as
key, tempo, beats, instrument, loudness and spectral measures, with its confidence and whether it is
stale or corrected; for note sequences and MIDI, their length in bars and beats, pitch range, note
density, the keys they fit, their rhythm and their tempo map; and for automation curves, the
parameter a curve drives, its range and its shape. It holds the item's source as a typed provenance
record, such as imported from a pack or a folder, recorded in a session, rendered, generated by a
composition program, captured as a model, received from a collaborator, or derived from another
item. And it holds the item's license as a typed record: the owner's own work, a pack's license with
its terms and source, an open license and its version, other terms, or unknown. The owner sets the
license, or an assistant the owner connects, or the owner confirms one read from a license file
the pack holds; it is unknown until set. The license is an assertion the catalog keeps, and not
evidence of rights: a use that needs verified rights, such as a public release or training data,
checks its own record of those rights. Search combines filters on every field, text over metadata
and provenance, and similarity: similar sounds by an embedding of each audio item from a pinned
model, with an index for each model version, and similar note sequences by their interval and
rhythm patterns, whatever their transposition and tempo. People search in a view beside the
arrangement, with audition and drag into a track; the owner's assistants search through the same
actions: search, get an item, list its uses, set metadata and license, preview and place, keep and
release a keep mark, and subscribe. Placing an item adds a reference to it through the project's
previewable, undoable command; it never copies the item, and editing a placed note sequence or
curve in the new project makes a new item, whose provenance records the project it was found in. An entry stays searchable whatever tier holds its item,
with a waveform overview; an audition of an item held only on another computer fetches its first
chunks first; and an item that was pruned keeps its entry as absent. Collaborators
reach none of the owner's catalog; each collaborator's catalog indexes what they hold."""

[[requirement]]
id = 'EU-0008-067'
level = 'MUST'
polarity = 'required'
statement = 'The catalog MUST index every item in the stores of the owner.'
binds_to = 'system'
rationale = 'The owner finds every sample, recording, render, note sequence, MIDI file and curve in one place.'

[[requirement]]
id = 'EU-0008-068'
level = 'MUST'
polarity = 'required'
statement = 'The catalog MUST be built only from the typed records of the store and of the projects.'
binds_to = 'system'
rationale = 'The catalog is never a second authoritative record that can disagree with the store.'

[[requirement]]
id = 'EU-0008-069'
level = 'MUST'
polarity = 'required'
statement = 'The uses of an item MUST be taken only from committed project revisions.'
binds_to = 'system'
rationale = 'The catalog shows where an item is used, and never what a label claims.'

[[requirement]]
id = 'EU-0008-070'
level = 'MUST'
polarity = 'required'
statement = 'An entry MUST hold the metadata that its imported file carried.'
binds_to = 'system'
rationale = 'What the file said about itself stays searchable.'

[[requirement]]
id = 'EU-0008-071'
level = 'MUST'
polarity = 'forbidden'
statement = 'The original file name and folder of an imported item MUST NOT leave the computers of the owner.'
binds_to = 'system'
rationale = 'How the owner names and files material stays private.'

[[requirement]]
id = 'EU-0008-072'
level = 'MUST'
polarity = 'forbidden'
statement = 'Metadata, license text and provenance read from imported content MUST NOT be acted on as instructions or grants.'
binds_to = 'system'
rationale = 'Text planted in a pack changes nothing that the owner or an assistant does.'

[[requirement]]
id = 'EU-0008-073'
level = 'MUST'
polarity = 'required'
statement = 'An entry MUST hold the analysis results of its item with their confidence.'
binds_to = 'system'
rationale = 'The owner searches by what the material sounds like, and sees how sure each result is.'

[[requirement]]
id = 'EU-0008-074'
level = 'MUST'
polarity = 'required'
statement = 'An entry of a note sequence, a MIDI file or an automation curve MUST hold its symbolic features.'
binds_to = 'system'
rationale = 'Notes and automation are found by their musical properties.'

[[requirement]]
id = 'EU-0008-075'
level = 'MUST'
polarity = 'required'
statement = 'An entry MUST hold a typed provenance record of the source of its item.'
binds_to = 'system'
rationale = 'The owner sees where each item came from.'

[[requirement]]
id = 'EU-0008-076'
level = 'MUST'
polarity = 'required'
statement = 'The license of an item MUST stay unknown until the owner sets it, an assistant the owner connects sets it, or the owner confirms a license file of its pack.'
binds_to = 'system'
rationale = 'A license is never guessed.'

[[requirement]]
id = 'EU-0008-077'
level = 'MUST'
polarity = 'forbidden'
statement = 'A license in the catalog MUST NOT clear an item for a use that requires verified rights.'
binds_to = 'system'
rationale = 'An editable assertion is never taken as evidence of rights.'

[[requirement]]
id = 'EU-0008-078'
level = 'MUST'
polarity = 'required'
statement = 'A placement, a private export or a share with a collaborator of an item whose license is unknown or restricts that use MUST warn the owner.'
binds_to = 'system'
rationale = 'The owner works with material they hold and knows where its terms are in doubt.'

[[requirement]]
id = 'EU-0008-079'
level = 'MUST'
polarity = 'required'
statement = 'Search MUST combine filters on every field of an entry with text search over metadata and provenance.'
binds_to = 'system'
rationale = 'The owner narrows the library by any property in one query.'

[[requirement]]
id = 'EU-0008-080'
level = 'MUST'
polarity = 'required'
statement = 'Search MUST find sounds similar to a given audio item.'
binds_to = 'system'
rationale = 'The owner finds material that sounds alike without naming it.'

[[requirement]]
id = 'EU-0008-081'
level = 'MUST'
polarity = 'required'
statement = 'Search MUST find note sequences similar to a given sequence regardless of transposition and tempo.'
binds_to = 'system'
rationale = 'A melody or a rhythm is found in any key and at any tempo.'

[[requirement]]
id = 'EU-0008-082'
level = 'MUST'
polarity = 'required'
statement = 'A similarity result MUST show the version of the model that produced it and a score that is not presented as a probability.'
binds_to = 'system'
rationale = 'A similarity is never presented as a certainty.'

[[requirement]]
id = 'EU-0008-083'
level = 'MUST'
polarity = 'required'
statement = 'Each search result MUST say why it matched.'
binds_to = 'system'
rationale = 'The owner sees the filters, the text or the similarity behind each result.'

[[requirement]]
id = 'EU-0008-084'
level = 'MUST'
polarity = 'required'
statement = 'A person and the assistants of the owner MUST reach the same catalog actions with the same results.'
binds_to = 'system'
rationale = 'An assistant finds and places exactly what the owner would.'

[[requirement]]
id = 'EU-0008-085'
level = 'MUST'
polarity = 'required'
statement = 'Placing an item MUST add a reference to its identity through the previewable, undoable command of the project.'
binds_to = 'system'
rationale = 'A placement is an ordinary edit that the owner sees and can undo.'

[[requirement]]
id = 'EU-0008-086'
level = 'MUST'
polarity = 'forbidden'
statement = 'Placing an item MUST NOT copy it.'
binds_to = 'system'
rationale = 'Reuse never adds a second copy to the store.'

[[requirement]]
id = 'EU-0008-087'
level = 'MUST'
polarity = 'required'
statement = 'Editing a placed note sequence or automation curve MUST leave the item in its source project unchanged.'
binds_to = 'system'
rationale = 'Reusing a clip never changes the project it came from.'

[[requirement]]
id = 'EU-0008-088'
level = 'MUST'
polarity = 'required'
statement = 'An entry MUST stay searchable whatever tier holds its item.'
binds_to = 'system'
rationale = 'Archived material is found as easily as material on the working computer.'

[[requirement]]
id = 'EU-0008-089'
level = 'MUST'
polarity = 'required'
statement = 'A pruned item MUST keep its entry, with its metadata, analysis, uses and pruning record.'
binds_to = 'system'
rationale = 'The owner sees what was removed and where it was used.'

[[requirement]]
id = 'EU-0008-090'
level = 'MUST'
polarity = 'required'
statement = 'A place command of a pruned item MUST be refused as unavailable.'
binds_to = 'system'
rationale = 'A project never gains a reference to content that is not held.'
relations = [ { kind = 'depends_on', target = 'EU-0008-089' } ]

[[requirement]]
id = 'EU-0008-091'
level = 'MUST'
polarity = 'required'
statement = 'Where a pruned identity is held again, its entry MUST become present again without a new reference.'
binds_to = 'system'
rationale = 'Content that returns from a holder or a collaborator is usable at once.'

[[requirement]]
id = 'EU-0008-092'
level = 'MUST'
polarity = 'forbidden'
statement = 'A collaborator MUST NOT reach any entry of the catalog of the owner.'
binds_to = 'system'
rationale = 'Sharing a project never discloses the rest of the library.'

[[requirement]]
id = 'EU-0008-093'
level = 'MUST'
polarity = 'required'
statement = 'The catalog MUST let a subscriber follow new items, analysis progress and changes of availability.'
binds_to = 'system'
rationale = 'A view or an assistant keeps up with the library without asking again.'

[[requirement]]
id = 'EU-0008-128'
level = 'MUST'
polarity = 'required'
statement = 'The provenance of a placed item MUST record the project it was found in.'
binds_to = 'system'
rationale = 'The owner sees where reused material came from.'

[[requirement]]
id = 'EU-0008-129'
level = 'MUST'
polarity = 'required'
statement = 'An entry of an audio item MUST keep a waveform overview whatever tier holds the item.'
binds_to = 'system'
rationale = 'Archived audio is recognized at a glance without fetching it.'

[[requirement]]
id = 'EU-0008-130'
level = 'MUST'
polarity = 'required'
statement = 'An audition of an item that is not held locally MUST fetch the first chunks of the item first.'
binds_to = 'system'
rationale = 'Auditioning cold material starts sounding as soon as possible.'
