[section]
anchor = 'items'
title = 'Items, identities and references'
problem = """\
  A musician's material is copied into many projects and stored many times, a sample encoded \
  another way looks like another sample, and a project that refers to a file by where it is opens \
  with other content once the file moves or changes."""
motivation = """\
  An identity computed from what an item holds, whatever its encoding, and references by identity \
  alone, let each item be stored once and let a project open with exactly the content it was saved \
  with."""
prose = """
The content store holds items. Each item has one kind of a closed set: source original, recording
take, rendered result, export, note sequence, MIDI file, automation curve, composition program
source, captured model, analysis result and other blob. A rendered result is a bounce, a stem, a
frozen track or a prepared segment. An item never changes once it is stored. An item's identity is
a cryptographic digest computed from what it holds. For audio, the digest covers a canonical description of the
format and the decoded sample values, so the same samples stored in two encodings, or moved to a
later codec, are one item. For a note sequence, an automation curve or a composition program
source, the digest covers the canonical serialization the project model defines for it, so equal
notes or equal curves are one item whatever project or track they came from. Any other item's
digest covers its bytes. Each digest is separated by the item's kind and the version of its schema.
An imported file keeps its original bytes as a source original, beside the decoded copy a session
works with, and the notes parsed from an imported MIDI file are a second item linked to the file.
An item is stored and moved in chunks. A list of an item's chunks, signed by the computer that
publishes it, lets a reader check each chunk on its own as it arrives, seek to a frame and fetch a
range alone. The list is accepted only once its chunks decode to the item's identity, and a new
chunk format adds a list without changing the identity. Chunks don't share content between items:
storage saves by whole item. A recording is stored as one item for each take, from its start to
its stop, and a take group lists the takes with their start positions, tracks, inputs and markers.
Where capture runs across takes, the audio between takes is an item of the group, so nothing
captured is lost. A project refers to content only by an item's identity and kind and, for audio, a
half-open frame range. A trim, a split, a comp or a fade refers to its source items, so editing
doesn't make new audio content; new audio content comes from recording, import, rendering,
consolidation and export."""

[[requirement]]
id = 'EU-0008-001'
level = 'MUST'
polarity = 'required'
statement = 'Each item MUST have exactly one kind of the closed set of item kinds.'
binds_to = 'system'
rationale = 'Every reader of an item treats it by the same kind.'

[[requirement]]
id = 'EU-0008-002'
level = 'MUST'
polarity = 'forbidden'
statement = 'An item MUST NOT change once it is stored.'
binds_to = 'system'
rationale = 'A reference to an item always reads the same content.'

[[requirement]]
id = 'EU-0008-141'
level = 'MUST'
polarity = 'required'
statement = "An item's identity MUST be a cryptographic digest."
binds_to = 'system'
rationale = 'No one can make two items that share an identity, so content found by its identity is always the item that identity was computed from.'

[[requirement]]
id = 'EU-0008-003'
level = 'MUST'
polarity = 'required'
statement = 'The identity of an audio item MUST be computed from its decoded sample values and a canonical description of their format.'
binds_to = 'system'
rationale = 'The same samples are one item however they are encoded.'

[[requirement]]
id = 'EU-0008-004'
level = 'MUST'
polarity = 'forbidden'
statement = 'A change of the encoding or the codec version of an audio item MUST NOT change its identity.'
binds_to = 'system'
rationale = 'A codec migration never changes the references of a project.'
relations = [ { kind = 'depends_on', target = 'EU-0008-003' } ]

[[requirement]]
id = 'EU-0008-005'
level = 'MUST'
polarity = 'required'
statement = 'The identity of a note sequence, an automation curve or a composition program source MUST be computed from the canonical serialization that the project model defines for it.'
binds_to = 'system'
rationale = 'Equal notes or equal curves are one item whatever project or track they came from.'

[[requirement]]
id = 'EU-0008-006'
level = 'MUST'
polarity = 'forbidden'
statement = 'Two items of different kinds MUST NOT share an identity, even where their bytes are equal.'
binds_to = 'system'
rationale = 'A note sequence and an audio chunk with equal bytes stay two items.'

[[requirement]]
id = 'EU-0008-007'
level = 'MUST'
polarity = 'required'
statement = 'The store MUST keep the original bytes of each imported file unchanged, beside any decoded copy of it.'
binds_to = 'system'
rationale = 'An import never loses what the file held.'

[[requirement]]
id = 'EU-0008-008'
level = 'MUST'
polarity = 'required'
statement = 'The note sequence parsed from an imported MIDI file MUST be stored as an item of its own, linked to the file by its provenance.'
binds_to = 'system'
rationale = 'The notes are found and reused like any note sequence, and the file stays as it was imported.'

[[requirement]]
id = 'EU-0008-009'
level = 'MUST'
polarity = 'required'
statement = 'Each chunk of an item MUST be verified against the chunk list of the item before it counts as present.'
binds_to = 'system'
rationale = 'A corrupt or forged chunk never reaches a session.'

[[requirement]]
id = 'EU-0008-010'
level = 'MUST'
polarity = 'required'
statement = 'A reader MUST be able to fetch and verify one frame range of an audio item without fetching the rest of it.'
binds_to = 'system'
rationale = 'A session seeks and plays from a long item without waiting for all of it.'

[[requirement]]
id = 'EU-0008-011'
level = 'MUST'
polarity = 'forbidden'
statement = 'The store MUST NOT accept a chunk list whose chunks do not decode to the identity of its item.'
binds_to = 'system'
rationale = 'Every accepted list reads back exactly the item it names.'

[[requirement]]
id = 'EU-0008-012'
level = 'MUST'
polarity = 'forbidden'
statement = 'A new chunk format MUST NOT change the identity of an item or any reference to it.'
binds_to = 'system'
rationale = 'The store changes how it cuts content without touching any project.'

[[requirement]]
id = 'EU-0008-013'
level = 'MUST'
polarity = 'required'
statement = 'Each take of a recording MUST be stored as an item of its own.'
binds_to = 'system'
rationale = 'A project that uses one take fetches that take alone.'

[[requirement]]
id = 'EU-0008-014'
level = 'MUST'
polarity = 'required'
statement = 'A take group MUST list each take of its recording with its start position, its track, its input and its markers.'
binds_to = 'system'
rationale = 'The takes of a recording are found and placed together.'

[[requirement]]
id = 'EU-0008-015'
level = 'MUST'
polarity = 'required'
statement = 'Audio captured between the takes of a continuous capture MUST be kept as an item of the take group.'
binds_to = 'system'
rationale = 'Nothing captured is lost when a recording is cut into takes.'

[[requirement]]
id = 'EU-0008-016'
level = 'MUST'
polarity = 'required'
statement = 'A project MUST refer to content only by the identity and the kind of an item and, for audio, a frame range.'
binds_to = 'system'
rationale = 'A reference stays valid wherever the content is held.'

[[requirement]]
id = 'EU-0008-017'
level = 'MUST'
polarity = 'forbidden'
statement = 'A reference to content MUST NOT hold a location, a computer or a holder.'
binds_to = 'system'
rationale = 'Moving content between computers never breaks a project.'

[[requirement]]
id = 'EU-0008-018'
level = 'MUST'
polarity = 'required'
statement = 'A project MUST open with exactly the content that its revision refers to.'
binds_to = 'system'
rationale = 'A saved project sounds the same every time it opens.'

[[requirement]]
id = 'EU-0008-019'
level = 'MUST'
polarity = 'forbidden'
statement = 'A trim, a split, a comp or a fade MUST NOT create new audio content.'
binds_to = 'system'
rationale = 'Editing in the arrangement never adds to the store.'

[[requirement]]
id = 'EU-0008-020'
level = 'MUST'
polarity = 'required'
statement = 'The store MUST refuse a chunk or a chunk list that fails its verification.'
binds_to = 'system'
rationale = 'Malformed or forged content is never stored or served.'
