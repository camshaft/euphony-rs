[section]
anchor = 'deduplication'
title = 'Storing each item once'
problem = """\
  A sample pack copied into each project, a file imported from two folders, and an export equal to \
  an earlier bounce fill disks with copies, and the saving from removing them is unknown until it \
  is measured."""
motivation = """\
  Storing by identity at publication, in transfer and on holders keeps each item once on each \
  computer, and a scan that reads the owner's own library without changing it shows the saving \
  before anything moves."""
prose = """
Deduplication is by whole item. An item whose identity a computer already holds isn't stored again
on it, and the new reference points at the existing item. Two computers exchange identities and
send only the items the receiver lacks, and of an item it holds in part, only the missing chunks. A
storage computer holds each item once for every project and every working computer it serves. The
saving is largest for a sample pack reused across projects: n projects that use a pack store it
once instead of n times. Two takes don't share samples, and a render after an edit shares nothing with
the render before it, so each stays its own item; an export, a freeze or consolidated audio with no
transform applied equals its source and is stored once. Note sequences, MIDI and automation are
small, so their identity matters for finding where a clip is used more than for disk space. The
library scan reads an existing library without changing it, and reports the duplicate bytes it
finds by item kind and by the point that would save them, so the owner sees the measured saving on
their own library before migrating anything."""

[[requirement]]
id = 'EU-0008-061'
level = 'MUST'
polarity = 'required'
statement = 'A computer MUST store each item at most once, however many projects refer to it.'
binds_to = 'system'
rationale = 'Reuse across projects does not cost more disk space.'

[[requirement]]
id = 'EU-0008-062'
level = 'MUST'
polarity = 'required'
statement = 'Publishing an item whose identity a computer already holds MUST add a reference to the existing item instead of a second copy.'
binds_to = 'system'
rationale = 'A file imported twice is stored once.'
relations = [ { kind = 'depends_on', target = 'EU-0008-061' } ]

[[requirement]]
id = 'EU-0008-063'
level = 'MUST'
polarity = 'required'
statement = 'A transfer MUST send only the items, and of a partly held item only the chunks, that the receiver lacks.'
binds_to = 'system'
rationale = 'The network carries only what the receiver needs.'

[[requirement]]
id = 'EU-0008-064'
level = 'MUST'
polarity = 'forbidden'
statement = 'The library scan MUST NOT change the library it reads.'
binds_to = 'system'
rationale = 'The owner measures the saving without any risk to the library.'

[[requirement]]
id = 'EU-0008-065'
level = 'MUST'
polarity = 'required'
statement = 'The library scan MUST report the duplicate bytes it finds by item kind and by the point at which storing each item once would save them.'
binds_to = 'system'
rationale = 'The owner sees where the saving comes from.'

[[requirement]]
id = 'EU-0008-066'
level = 'SHOULD'
polarity = 'required'
statement = 'The owner SHOULD see the measured saving of storing each item once before any content of their library moves into the store.'
binds_to = 'system'
rationale = 'The saving is measured on the library of the owner rather than promised.'
