[section]
anchor = 'continuity'
title = 'Continuing a session between rooms'
problem = """\
  A person who moves from the recording room to the mixing room in the middle of a session can stop a take, lose its inputs, or leave two computers that can both start recording."""
motivation = """\
  Moving control and not capture, under one control epoch that a stale computer cannot use, lets a take continue across rooms while only one computer at a time can start or stop one."""
prose = """
An active session is separate from any project revision. Its record holds the selected branch and
revision, the transport position and mode, the armed tracks, the registered live sources, the output
assignments, a control epoch and each person's view state. Computers paired with the owner's
subscribe to the session's changes and prefetch the selected manifest, recent edits and media. The
readiness of a computer is the state of its synchronized project data, its prepared audio, its
connected live inputs and its clock lock. The computer that captures a microphone keeps it and keeps
the raw recording, and its inputs reach another room as network routes with stable source identities
and qualified clocks. A person selects Continue session on the destination computer, which attaches
to the existing session instead of opening an unrelated branch. Moving the session authority or its
audio process to another computer is a separate checkpoint and recovery operation, which a room
switch during a take never performs."""

[[requirement]]
id = 'EU-0013-093'
level = 'MUST'
polarity = 'required'
statement = 'A person MUST be able to continue a recording session on another paired computer with the current project, controls and live inputs ready.'
binds_to = 'system'
rationale = 'A session moves with the person between rooms.'

[[requirement]]
id = 'EU-0013-094'
level = 'MUST'
polarity = 'required'
statement = 'An active session MUST be a record separate from every project revision.'
binds_to = 'system'
rationale = 'Moving a session never changes a revision, and a revision never carries a session.'

[[requirement]]
id = 'EU-0013-095'
level = 'MUST'
polarity = 'required'
statement = "Prefetch of a session MUST go only to computers paired with the owner's."
binds_to = 'system'
rationale = "Project data reaches only the owner's own computers."

[[requirement]]
id = 'EU-0013-096'
level = 'MUST'
polarity = 'required'
statement = 'The readiness view MUST show synchronized project data, prepared audio, connected live inputs and clock lock separately.'
binds_to = 'system'
rationale = 'A person sees exactly what is not ready yet.'

[[requirement]]
id = 'EU-0013-097'
level = 'MUST'
polarity = 'forbidden'
statement = 'Presence on the local network MUST NOT count as readiness.'
binds_to = 'system'
rationale = 'A computer that is merely reachable is not taken as ready.'

[[requirement]]
id = 'EU-0013-098'
level = 'MUST'
polarity = 'required'
statement = 'Continuing a session on another computer MUST restore its selection, editors, transport and monitoring assignments.'
binds_to = 'system'
rationale = 'The person picks up exactly where they were.'

[[requirement]]
id = 'EU-0013-099'
level = 'MUST'
polarity = 'forbidden'
statement = 'Moving the control of a session MUST NOT move physical inputs off the computer that captures them.'
binds_to = 'system'
rationale = 'A microphone stays with the computer it is plugged into.'

[[requirement]]
id = 'EU-0013-100'
level = 'MUST'
polarity = 'forbidden'
statement = 'Changing rooms MUST NOT stop a take.'
binds_to = 'system'
rationale = 'A performance is never lost to a room switch.'

[[requirement]]
id = 'EU-0013-101'
level = 'MUST'
polarity = 'required'
statement = 'Exclusive control of transport and recording MUST move by a conditional change of the control epoch.'
binds_to = 'system'
rationale = 'Only one computer at a time can start or stop a take.'

[[requirement]]
id = 'EU-0013-102'
level = 'MUST'
polarity = 'forbidden'
statement = 'A stale or repeated control message MUST NOT start a take.'
binds_to = 'system'
rationale = 'An old computer never starts a second recorder.'

[[requirement]]
id = 'EU-0013-103'
level = 'MUST'
polarity = 'required'
statement = 'After control moves, the previous controller MUST be read-only for transport and recording.'
binds_to = 'system'
rationale = 'Two computers never command the transport at once.'

[[requirement]]
id = 'EU-0013-104'
level = 'MAY'
polarity = 'required'
statement = 'Views of a session MAY stay attached on several computers at once.'
binds_to = 'system'
rationale = 'Watching a session never competes with controlling it.'

[[requirement]]
id = 'EU-0013-105'
level = 'MUST'
polarity = 'required'
statement = "Before it switches a computer's monitor output, the session MUST check its device format, prepared buffers, live subscriptions and clock quality."
binds_to = 'system'
rationale = 'An output is switched only to a computer that can play it.'

[[requirement]]
id = 'EU-0013-106'
level = 'MUST'
polarity = 'required'
statement = 'Where readiness fails, the session MUST keep the previous output and recording active and show what is missing.'
binds_to = 'system'
rationale = 'A failed switch never interrupts what is playing or recording.'

[[requirement]]
id = 'EU-0013-107'
level = 'MUST'
polarity = 'required'
statement = 'A supported audio transition MUST happen at a shared sample boundary with latency compensation.'
binds_to = 'system'
rationale = 'A transition has no gap where the hardware allows it.'

[[requirement]]
id = 'EU-0013-108'
level = 'MUST'
polarity = 'forbidden'
statement = 'An audio transition MUST NOT stop the outputs of other listeners.'
binds_to = 'system'
rationale = "Moving one person's monitoring leaves everyone else listening."

[[requirement]]
id = 'EU-0013-109'
level = 'MUST'
polarity = 'forbidden'
statement = 'The session MUST NOT claim an uninterrupted transfer where the hardware or the network cannot support one.'
binds_to = 'system'
rationale = 'A person is told the truth about a gap.'

[[requirement]]
id = 'EU-0013-110'
level = 'MUST'
polarity = 'forbidden'
statement = 'A room switch MUST NOT move the session authority during a take.'
binds_to = 'system'
rationale = 'Authority moves only at a checkpoint, never mid-take.'

[[requirement]]
id = 'EU-0013-111'
level = 'MUST'
polarity = 'required'
statement = 'A reopened replica MUST reconcile the completion of capture and establish a new control epoch before recording resumes.'
binds_to = 'system'
rationale = 'A recovered computer never becomes a second active recorder.'
