[section]
anchor = 'delivery'
title = 'Delivery and quality of the listening audio'
problem = """\
  A remote listener needs the host's mix as it changes, without the project's files, at the best quality the path can carry, and a stream that falls back to compressed audio without saying so misleads someone judging a mix."""
motivation = """\
  Streaming the mix the host already calculates, playing a collaborator's identical prepared copy where one exists, and a quality policy that every participant sees keep listening honest about what each person receives."""
prose = """
The host's audio process already calculates the main mix and the mix of each sink. The session
streams each participant's assigned sink from the host, and plays a collaborator's own prepared copy
of the playing revision and sink while that copy's manifest digest equals the host's. Rendering the
project on each participant's computer would need the whole project on every computer and would
diverge as soon as the host edits, so it is not a way of delivery. The lossy stream uses a standard
lossy codec for music, and the lossless stream carries the exact samples of the mix. Each session
has a listening-quality policy, which the owner chooses: lossless required, lossless preferred or
lossy. Lossy audio suits discussion of an arrangement, and judging a mix needs the lossless stream or
the prepared copy. The listening stream is playback delivery alone. A forwarding peer, which
receives one copy and sends it on, is a later addition for audiences larger than the upload of one
host."""

[[requirement]]
id = 'EU-0013-175'
level = 'MUST'
polarity = 'required'
statement = 'The host MUST stream each participant assigned sink as a live stream that follows every edit, live input and automation change at once.'
binds_to = 'system'
rationale = 'A participant listens to the project as it is now.'

[[requirement]]
id = 'EU-0013-176'
level = 'MUST'
polarity = 'forbidden'
statement = 'The listening stream MUST NOT carry stems or project files.'
binds_to = 'system'
rationale = 'Listening never hands over the material of a project.'

[[requirement]]
id = 'EU-0013-177'
level = 'MUST'
polarity = 'required'
statement = 'While the prepared copy of a collaborator holds the playing revision and sink with a manifest digest equal to that of the host, the session MUST play that prepared copy for the collaborator.'
binds_to = 'system'
rationale = 'A collaborator who already has the audio plays it losslessly and saves bandwidth.'

[[requirement]]
id = 'EU-0013-178'
level = 'MUST'
polarity = 'required'
statement = 'When the manifest digest of the host changes, the session MUST return the collaborator to the stream, aligned on the shared timeline, before the changed audio plays.'
binds_to = 'system'
rationale = 'A collaborator never plays a stale prepared copy.'

[[requirement]]
id = 'EU-0013-179'
level = 'MUST'
polarity = 'required'
statement = 'Playback of a prepared copy MUST be bit-identical to the prepared mix of the host.'
binds_to = 'system'
rationale = 'A prepared copy is the same audio, not an approximation.'

[[requirement]]
id = 'EU-0013-180'
level = 'MUST'
polarity = 'required'
statement = 'Each stream message MUST carry the transport generation, the sample position of its first sample, the host send time and the codec of its frames.'
binds_to = 'system'
rationale = 'A player places every packet on the timeline without other state.'

[[requirement]]
id = 'EU-0013-181'
level = 'MUST'
polarity = 'forbidden'
statement = 'A stream packet MUST NOT be sent again after its output time has passed.'
binds_to = 'system'
rationale = 'Late audio is dropped rather than delaying what follows.'

[[requirement]]
id = 'EU-0013-182'
level = 'MUST'
polarity = 'required'
statement = 'The lossless stream MUST decode to exactly the samples of the host.'
binds_to = 'system'
rationale = 'Lossless means the same samples.'

[[requirement]]
id = 'EU-0013-183'
level = 'MUST'
polarity = 'required'
statement = 'The lossy stream MUST carry full-band stereo audio at 48 kHz.'
binds_to = 'system'
rationale = 'Lossy listening still covers the whole audible band in stereo.'
params = [ { name = 'lossy_stream_sample_rate', type = 'integer', unit = 'Hz', bound = 'exact', value = 48000 } ]

[[requirement]]
id = 'EU-0013-184'
level = 'MUST'
polarity = 'required'
statement = 'The bit rate of the lossy stream MUST follow the congestion control of the path.'
binds_to = 'system'
rationale = 'The stream uses what the path carries, without a fixed limit.'

[[requirement]]
id = 'EU-0013-185'
level = 'MUST'
polarity = 'required'
statement = 'A path that cannot carry the lossy stream at its current rate MUST receive a lower rate instead of silence.'
binds_to = 'system'
rationale = 'A congested listener keeps hearing.'

[[requirement]]
id = 'EU-0013-186'
level = 'MUST'
polarity = 'required'
statement = 'Each participant MUST see the bit rate they receive.'
binds_to = 'system'
rationale = 'Each person knows the quality of what they hear.'

[[requirement]]
id = 'EU-0013-187'
level = 'MUST'
polarity = 'required'
statement = 'Each session MUST have a listening-quality policy of lossless required, lossless preferred or lossy, which the owner chooses.'
binds_to = 'system'
rationale = 'The owner decides how much quality the session needs.'

[[requirement]]
id = 'EU-0013-188'
level = 'MUST'
polarity = 'required'
statement = 'Every session MUST start with the lossless required policy.'
binds_to = 'system'
rationale = 'Compressed audio is never the unchosen default.'

[[requirement]]
id = 'EU-0013-189'
level = 'MUST'
polarity = 'required'
statement = 'Every participant MUST see the listening-quality policy of the session and the quality they actually receive.'
binds_to = 'system'
rationale = 'No one judges a mix on audio they believe is better than it is.'

[[requirement]]
id = 'EU-0013-190'
level = 'MUST'
polarity = 'required'
statement = 'Under lossless required, a participant whose path cannot carry the lossless stream MUST have its playback stopped with the reason instead of receiving lossy audio.'
binds_to = 'system'
rationale = 'A required quality is never quietly lowered.'

[[requirement]]
id = 'EU-0013-191'
level = 'MUST'
polarity = 'required'
statement = 'Under lossless preferred, every move of the stream between lossless and lossy MUST change the quality label of the participant.'
binds_to = 'system'
rationale = 'The label always matches the audio.'

[[requirement]]
id = 'EU-0013-192'
level = 'MUST'
polarity = 'forbidden'
statement = 'A participant receiving lossy audio MUST NOT be shown as receiving lossless audio.'
binds_to = 'system'
rationale = 'Compressed audio is never mistaken for exact audio.'

[[requirement]]
id = 'EU-0013-193'
level = 'MUST'
polarity = 'required'
statement = 'At join, a client MUST check its decoders and report their measured decoding time.'
binds_to = 'system'
rationale = 'The host knows each participant can play in time.'

[[requirement]]
id = 'EU-0013-194'
level = 'MUST'
polarity = 'required'
statement = 'A client that cannot run a decoder that the listening-quality policy needs MUST be refused as a listener with the reason.'
binds_to = 'system'
rationale = 'A participant is never joined to silent or late audio.'

[[requirement]]
id = 'EU-0013-195'
level = 'MUST'
polarity = 'forbidden'
statement = 'A participant client MUST NOT keep the listening stream as a project object, use it for a render or offer it to another peer.'
binds_to = 'system'
rationale = 'The stream is playback alone, never a source of project audio.'

[[requirement]]
id = 'EU-0013-196'
level = 'MUST'
polarity = 'required'
statement = 'Project objects, cached renders and audio that peers exchange MUST stay exact in every session, whatever its listening-quality policy.'
binds_to = 'system'
rationale = 'Lossy listening never degrades saved or exchanged audio.'

[[requirement]]
id = 'EU-0013-197'
level = 'MUST'
polarity = 'forbidden'
statement = 'The encoding work of the host MUST NOT grow with the number of participants that share a sink.'
binds_to = 'system'
rationale = 'Encoding cost grows with the number of sinks, not with the size of the audience.'

[[requirement]]
id = 'EU-0013-198'
level = 'MUST'
polarity = 'forbidden'
statement = 'The session MUST NOT cap the number of participants.'
binds_to = 'system'
rationale = 'The limit is what the host can carry, not a number chosen in advance.'

[[requirement]]
id = 'EU-0013-199'
level = 'MUST'
polarity = 'required'
statement = 'The host MUST admit participants while its measured upload carries them.'
binds_to = 'system'
rationale = 'Admission follows the measured capacity of the host.'

[[requirement]]
id = 'EU-0013-219'
level = 'MUST'
polarity = 'required'
statement = 'Each participant MUST receive the listening stream encrypted for that participant alone.'
binds_to = 'system'
rationale = 'No participant can read the stream another participant receives.'
