[[spec]]
level = "MUST"
quote = "Each evidence record MUST hold its stable identity, its schema version, its subject person, its author or source kind, its project, session and branch revision, its event cursor, its observation time, its cause, its revisions before and after, its authorized asset references, its visibility policy and its consent provenance."
