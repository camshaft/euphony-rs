quote = "Where a batch names the caller that euphony authenticated, its project and its branch, and leaves out its expected revision or its idempotency key, euphony MUST refuse the batch as invalid input after the checks of EU-0004-056, EU-0004-059, EU-0004-095 and EU-0004-096."
