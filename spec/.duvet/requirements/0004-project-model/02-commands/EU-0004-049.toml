target = "rendered/0004-project-model/02-commands.md#EU-0004-049"

[[spec]]
level = "MUST"
quote = "Where the actor that a batch names is not the caller that euphony authenticated, euphony MUST refuse the batch as denied before any other check of the batch that this RFC states but the check of EU-0004-063: before the checks of EU-0004-056, EU-0004-059, EU-0004-095, EU-0004-096, EU-0004-064 and EU-0004-017, and the checks of the batch's commands against the project schema and of its idempotency key."
