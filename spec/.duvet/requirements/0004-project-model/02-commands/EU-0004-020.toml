target = "rendered/0004-project-model/02-commands.md#EU-0004-020"

[[spec]]
level = "MUST"
quote = "A batch sent again with the project, branch, actor, idempotency key and commands of a committed batch MUST receive the outcome of that committed batch, without a new approval by the owner, except where euphony refuses it before it checks its idempotency key: as unpaired, outside link level, or link expired or revoked by the command gateway of the overview RFC, as denied by EU-0004-049, EU-0004-056 or EU-0004-092, or as invalid input by EU-0004-093 or EU-0004-064, such as a retry from a device the owner unpaired or over a share link the owner revoked after that batch committed, a retry from a caller who lost change access after that batch committed, or a retry that reaches a copy after another copy came to hold the branch of that batch."
