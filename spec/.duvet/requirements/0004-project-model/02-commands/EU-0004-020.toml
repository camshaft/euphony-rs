[[spec]]
level = "MUST"
quote = "A batch sent again with the project, actor, idempotency key and commands of a committed batch MUST receive the outcome of that committed batch, except where EU-0004-049 or EU-0004-056 refuses it as denied, such as a retry from a caller who lost change access after that batch committed."
