level = "MUST"
quote = "Where a batch doesn't name an actor in a form that euphony can compare with the caller that euphony authenticated, or names that caller and leaves out its project, or names that caller and a project that the caller may change and leaves out its expected revision or its idempotency key, euphony MUST refuse the batch as invalid input."
