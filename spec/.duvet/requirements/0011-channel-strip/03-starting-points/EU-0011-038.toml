level = "MUST"
quote = "A stage's starting point MUST be a deterministic function of exactly these inputs: the track's role, the analysis results of the track's audio as it reaches the stage, the role profile's targets, the musician's approved preferences for strip settings, the calculation's version and the stage's processor version."
