target = "rendered/0006-distributed-rendering/05-workers.md#EU-0006-094"

[[spec]]
level = "MUST"
quote = "When a present worker that renders a job's render profile asks for a lease, and the time since that job's running attempt started or last reported progress, whichever is later, exceeds the mean of the attempt's measured report intervals by more than their standard deviation, the host MUST offer that job to the asking worker at the job's priority level and cancel that attempt once a replacing attempt starts. An attempt's measured report intervals are its worker's report intervals for the job's render profile once they show a standard deviation, and otherwise the report intervals of every worker for that render profile, each counting the time from an attempt's start to its first progress report as an interval."
