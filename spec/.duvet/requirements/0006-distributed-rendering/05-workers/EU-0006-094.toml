target = "rendered/0006-distributed-rendering/05-workers.md#EU-0006-094"

[[spec]]
level = "MUST"
quote = "When a present worker that renders a job's render profile and doesn't hold that job's running attempt asks for a lease, and the time since that attempt started or last reported progress, whichever is later, exceeds the largest of the attempt's measured report intervals by more than their population standard deviation, the host MUST offer that job to the asking worker at the job's priority level and cancel that attempt once a replacing attempt starts. An attempt's measured report intervals are its worker's report intervals for the job's render profile once their population standard deviation is above zero, which takes at least two unequal intervals, and otherwise the report intervals of every worker for that render profile once their population standard deviation is above zero, each counting the time from an attempt's start to its first progress report as an interval."
