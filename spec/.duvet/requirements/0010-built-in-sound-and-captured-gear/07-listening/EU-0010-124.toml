[[spec]]
level = "MUST"
quote = "A listener MUST meet the criterion only when the exact one-sided upper confidence bound on their proportion of correct answers, at a confidence level of one minus the tolerated error rate divided by the number of attempts and the number of listeners, is below the tolerated proportion."
